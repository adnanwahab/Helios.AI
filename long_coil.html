<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Long Coil</title>
<meta name="theme-color" content="#110d0b">
<meta name="description" content="Technology from 3.3 million BCE to today, wound one loop per century, then projected ten years ahead to 2036. Every projected milestone names the plan, roadmap or trend it rests on and a confidence tier.">
<link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Sofia+Sans+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE   an instrument for exploring, calm and exact; a museum case at night
   IDEA    a khipu, the Andean knotted-cord record: eight dyed strands, one knot per invention, wound into a coil
   PICTURE the 3D coil itself, full-bleed: deep time fanned on a log scale, one loop per century, fraying into a cone to 2036
   COLOUR  warm black ground, warm white ink, eight validated strand hues; the projected decade framed in ice white
   TYPE    Sofia Sans Condensed 800 for years and titles, Instrument Sans for reading
   LAYOUT  laptop: coil left, period panel right, time scrubber along the bottom; phone: title, coil, scrubber, then the panel */
:root{color-scheme:dark;--bg:#110d0b;--bg2:#18130f;--bg3:#211a15;--ink:#f3ede6;--ink2:#c2b8ad;--mute:#968c82;--line:rgba(243,237,230,.13);--ice:#d7ecff;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--disp:"Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:var(--ice);text-underline-offset:3px}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:12px max(2vw,16px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font:800 clamp(30px,3.1vw,40px)/1.05 var(--disp);letter-spacing:-.01em;margin:0}
.brand p{margin:0;color:var(--ink2);font-size:15px;max-width:52ch}
.brand{flex:1 1 480px}
.tools{display:flex;flex-wrap:nowrap;gap:10px;align-items:center;flex:0 1 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;width:min(320px,100%)}
.search svg{flex:none;opacity:.7}
.search input{all:unset;flex:1;font-size:16px;color:var(--ink);height:42px}
.search input::placeholder{color:var(--mute)}
.search:focus-within{outline:2px solid var(--ice);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:0 16px;height:44px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.chip:focus-visible,.row:focus-visible,.tour:focus-visible,.scrub:focus-visible,.x:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 55% 45%,#1d1612 0%,var(--bg) 70%)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#cv.drag{cursor:grabbing}
#cv.hov{cursor:pointer}
.legend{position:absolute;top:12px;left:max(1.4vw,12px);right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{flex:none;pointer-events:auto;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 9px;border-radius:16px;border:1px solid var(--line);background:rgba(17,13,11,.72);color:var(--ink2);font-size:13px;cursor:pointer;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip b{font-weight:500;color:var(--mute)}
.chip[aria-pressed=true]{color:var(--ink);border-color:var(--c);background:rgba(17,13,11,.9)}
.chip.off{opacity:.45}
.yr{position:absolute;right:max(1.4vw,14px);bottom:104px;text-align:right;pointer-events:none;line-height:1}
.yr b{display:block;font:800 clamp(44px,6vw,80px)/.9 var(--disp);letter-spacing:-.02em;white-space:nowrap}
.yr span{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.yr.fut b,.yr.fut span{color:var(--ice)}
.hint{position:absolute;left:max(1.4vw,12px);bottom:98px;margin:0;font-size:13px;color:var(--mute);white-space:nowrap;pointer-events:none}
.tour{position:absolute;left:max(1.4vw,12px);bottom:126px;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:rgba(17,13,11,.8);cursor:pointer;font-size:14px}
.tour:hover{border-color:var(--ink2)}
.scrub{position:absolute;left:max(1.4vw,12px);right:max(1.4vw,12px);bottom:14px;height:70px;cursor:ew-resize;touch-action:none;user-select:none}
.scrub canvas{position:absolute;left:0;right:0;top:0;width:100%;height:40px}
.scrub .ticks{position:absolute;left:0;right:0;top:46px;height:20px;font-size:13px;color:var(--mute)}
.scrub .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scrub .ticks span.f{color:var(--ice)}
.thumb{position:absolute;top:-6px;width:2px;height:52px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
.thumb::after{content:"";position:absolute;left:-5px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--bg)}
.thumb.fut,.thumb.fut::after{background:var(--ice)}
.tip{position:absolute;pointer-events:none;max-width:280px;background:rgba(24,19,15,.96);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:3}
.tip b{display:block;font-weight:600}
.tip small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.panel{position:relative;overflow:auto;border-left:1px solid var(--line);background:var(--bg2);padding:20px 22px 40px;scrollbar-color:#3a2f27 transparent}
.ph h2{font:800 clamp(30px,2.6vw,38px)/1.05 var(--disp);margin:0;letter-spacing:-.01em}
.ph h2.fut{color:var(--ice)}
.ph p{margin:6px 0 0;color:var(--ink2);font-size:15px}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:14px 0 4px;font-size:13px;color:var(--ink2);align-items:center}
.key svg{display:block}
.card{margin:16px 0 6px;padding:14px 16px 16px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;background:var(--bg3);position:relative}
.card .meta{font-size:13px;color:var(--ink2);padding-right:40px}
.card h3{margin:4px 0 6px;font:800 26px/1.08 var(--disp)}
.card p{margin:0 0 8px;font-size:15px}
.card .basis{color:var(--ink2)}
.card .basis b,.card .basis strong{color:var(--ink);font-weight:600}
.x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:18px;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);white-space:nowrap}
.list{list-style:none;margin:14px 0 0;padding:0}
.yh{font:800 20px/1 var(--disp);color:var(--ink2);margin:18px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.yh.now{color:var(--ice)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 8px;cursor:pointer}
.row:hover{background:var(--bg3)}
.row.on{background:var(--bg3);box-shadow:inset 3px 0 0 var(--c)}
.row.ny{grid-template-columns:0 minmax(0,1fr);gap:2px 0}
.list.wide .row{grid-template-columns:92px minmax(0,1fr)}
.row .y{font:600 15px/1.3 var(--disp);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .t{font-weight:600;font-size:15px;line-height:1.3;display:flex;align-items:baseline;gap:7px}
.row .t i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.row .t i.h{background:none;box-shadow:inset 0 0 0 2px var(--c)}
.row .d{grid-column:2;font-size:14px;color:var(--ink2);line-height:1.4}
.row .r{grid-column:2;font-size:13px;color:var(--mute)}
.sec{margin:22px 0 4px;font:800 20px/1.1 var(--disp)}
.fc{display:grid;gap:10px;margin-top:8px}
.fcr{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.fcr .w{color:var(--ink2);font-size:13px}
.fcr p{margin:3px 0}
.out{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap}
.about{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.about p{margin:0 0 8px}
.empty{color:var(--mute);font-size:14px;margin:16px 0}
.ledger{grid-column:1/-1;overflow:auto;padding:24px max(4vw,16px) 60px}
.ledger h2{font:800 clamp(30px,3vw,42px)/1.05 var(--disp);margin:8px 0 8px}
.ledger h3{font:800 26px/1.1 var(--disp);margin:34px 0 6px}
.ledger .lede{color:var(--ink2);max-width:72ch;margin:0 0 6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);background:var(--bg2);position:sticky;top:0}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.ledger .about{max-width:78ch}
.err{padding:30px;color:var(--ink2)}
@media (max-width:999px){
.legend{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;right:0;padding-right:12px}
.legend::-webkit-scrollbar{display:none}
.app{display:block;height:auto}
.stage{height:min(72vh,660px);min-height:460px}
.panel{border-left:0;border-top:1px solid var(--line);padding:18px max(4vw,16px) 40px}
.ledger{padding:20px max(4vw,16px) 50px}
}
@media (max-width:600px){
.brand p{font-size:14px}
.top{padding:10px 16px}
.search{width:100%}
.tools{width:100%;flex:1 1 100%}
.tools .search{flex:1}
.legend .chip{height:28px;font-size:13px;padding:0 9px 0 8px}
.legend .chip b{display:none}
.yr{bottom:102px}
.yr b{font-size:44px}
.hint{display:none}
.tour{bottom:98px;height:36px;font-size:13px}
.scrub .ticks span.o{display:none}
table{font-size:13px}
.stack thead{display:none}
.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
.stack td{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:10px;border:0;padding:3px 12px}
.stack td::before{content:attr(data-l);color:var(--mute)}
.stack td:empty{display:none}
}
@media (prefers-reduced-motion:reduce){.tour{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>The Long Coil</h1>
      <p>Technology from 3.3 million BCE, wound one loop per century, then projected ten years ahead to 2036.</p>
    </div>
    <div class="tools">
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span><input id="q" type="search" placeholder="Search people, things, ideas" autocomplete="off"></label>
      <div class="seg"><button id="vCoil" aria-pressed="true">Coil</button><button id="vLedger" aria-pressed="false">Ledger</button></div>
    </div>
  </header>
  <section class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img" aria-label="A coil of technology milestones: eight coloured strands run in from 3.3 million BCE on a logarithmic scale, braid into one loop per century from 1026 to 2026, then fray into a cone of projected milestones to 2036. The panel lists the records for the period in focus."></canvas>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
    <button class="tour" id="tour" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg><span>Fly from 3.3M BCE</span></button>
    <p class="hint" id="hint">Drag to turn, scroll to zoom, click a knot to read it.</p>
    <div class="yr" id="yr"><b id="yrN">2031</b><span id="yrL">Projected</span></div>
    <div class="scrub" id="scrub" tabindex="0" role="slider" aria-label="Year in focus" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="950">
      <canvas id="hist" aria-hidden="true"></canvas>
      <div class="thumb" id="thumb"></div>
      <div class="ticks" id="ticks"></div>
    </div>
  </section>
  <aside class="panel" id="panel"><p class="empty">Loading the record…</p></aside>
  <section class="ledger" id="ledger" hidden></section>
</div>
<!-- The record, one entry per line. Edit here; the page reads it on load.

     u  source URL, or w  English Wikipedia article slug · m  major (ringed, labelled first)
     p: r  confidence (s scheduled, l likely, p plausible, x long shot) · b  the plan, roadmap or trend it rests on
     f: by  who said it · o  outcome (t came true, l late, p partly, w wrong, m missed its date, n pending) · n  note · nd  no date given -->

<script>
{
const LIN=[
  {n:'Sky & space',c:'#3987e5'},
  {n:'Energy & power',c:'#d95926'},
  {n:'Movement',c:'#199e70'},
  {n:'Making & building',c:'#c98500'},
  {n:'Signals & media',c:'#d55181'},
  {n:'Food & life',c:'#0ca30c'},
  {n:'Number & computing',c:'#9085e9'},
  {n:'Medicine & body',c:'#e66767'}];
const TIER={s:{n:'Scheduled',d:'Set by law, a standard or the calendar'},l:{n:'Likely',d:'Firm plan or strong trend, roughly 60–85%'},p:{n:'Plausible',d:'Credible but with real obstacles, roughly 30–60%'},x:{n:'Long shot',d:'A stated goal or bold extrapolation, under about 30%'}};
const OUT={t:{n:'Came true',c:'#0ca30c',i:'M3 8.5l3 3 7-7'},l:{n:'Came true, late',c:'#fab219',i:'M8 3v5l3 2M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13'},p:{n:'Partly',c:'#fab219',i:'M8 1.5a6.5 6.5 0 1 0 0 13V1.5'},w:{n:'Wrong',c:'#d03b3b',i:'M3.5 3.5l9 9M12.5 3.5l-9 9'},m:{n:'Missed its date',c:'#ec835a',i:'M2 8h9M8 4l4 4-4 4'},n:{n:'Pending',c:'#968c82',i:'M3 8h.5M8 8h.5M13 8h.5'}};
const ICE='#d7ecff', BG='#110d0b', INK='#f3ede6', INK2='#c2b8ad', MUTE='#968c82';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a.toFixed(3)})`;};
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* time: tau < 0 is deep time on a log scale, 0..10 is 1026..2026 (one loop per century), 10..10.1 is the projected decade */
const Y0=1026, YN=2026, YF=2036, OFF=30, YMIN=-3300000;
const U=y=>Math.log10(1+(Y0-y)/OFF), UMAX=U(YMIN);
const tauOf=y=>y>=Y0?(y-Y0)/100:-U(y);
const yearOf=t=>t>=0?Y0+t*100:Y0-OFF*(Math.pow(10,-t)-1);
const TNOW=(YN-Y0)/100, TMAX=(YF-Y0)/100;
const PA=0.2, PB=0.88;
const tToP=t=>t<0?PA*(1+t/UMAX):t<=TNOW?PA+(PB-PA)*t/TNOW:PB+(1-PB)*(t-TNOW)/(TMAX-TNOW);
const pToT=p=>{p=clamp(p,0,1);return p<PA?-UMAX*(1-p/PA):p<=PB?(p-PA)/(PB-PA)*TNOW:TNOW+(p-PB)/(1-PB)*(TMAX-TNOW);};
function fmtY(y){y=Math.round(y);if(y<=-1e6)return(Math.round(-y/1e5)/10)+'M BCE';if(y<0)return(-y).toLocaleString('en-US')+' BCE';if(y<1000)return y+' CE';return String(y);}
function roundY(y){if(y>=1000)return Math.round(y);const a=Math.abs(y);const s=a>=1e5?1e4:a>=1e4?1000:a>=3000?100:10;return Math.round(y/s)*s||1;}

/* geometry of the coil */
const A0=-Math.PI/2, R0=6.5, RG=0.85, HP=10, RT=1.2, BR=0.22;
const ang=t=>A0-TAU*t, Rr=t=>R0+RG*t;
const C=t=>{const a=ang(t),R=Rr(t);return [R*Math.cos(a),R*Math.sin(a),HP*t];};
function frame(t){const a=ang(t),R=Rr(t),ca=Math.cos(a),sa=Math.sin(a);const T=norm([RG*ca+R*sa*TAU,RG*sa-R*ca*TAU,HP]);let N=[-ca,-sa,0];N=norm(sub(N,mul(T,dot(N,T))));return {T,N,B:norm(cross(T,N))};}
const FS=3.5, gt=t=>t<=TNOW?t:TNOW+(t-TNOW)*FS;
const fray=t=>t<=TNOW?0:Math.pow((t-TNOW)/(TMAX-TNOW),1.3);
const tubeR=t=>RT+3.2*fray(t);
const phi=(s,t)=>TAU*s/8+Math.PI*t;
const C0=C(0), F0=frame(0);
const D=norm(add(mul(F0.T,-1),[0,0,-0.9]));
const E1=norm(sub(F0.N,mul(D,dot(F0.N,D))));
let E2=norm(cross(D,E1)); if(dot(E2,F0.B)<0)E2=mul(E2,-1);
const LR=7.2;
const rootC=u=>add(C0,add(mul(D,LR*u),[0,0,-0.16*u*u]));
const rootR=u=>RT+2.3*Math.pow(u,1.15);
function strandAt(s,t){
  if(t>=0){const g=gt(t),c=C(g),f=frame(g),r=tubeR(t),p=phi(s,g);return add(c,add(mul(f.N,r*Math.cos(p)),mul(f.B,r*Math.sin(p))));}
  const u=-t,c=rootC(u),r=rootR(u),p=phi(s,0)+0.3*u;return add(c,add(mul(E1,r*Math.cos(p)),mul(E2,r*Math.sin(p))));}
const centerAt=t=>t>=0?C(gt(t)):rootC(-t);
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
function randUnit(){let v;do{v=[rnd()*2-1,rnd()*2-1,rnd()*2-1];}while(dot(v,v)>1||dot(v,v)<.05);return norm(v);}

/* state */
let DATA=[],HIS=[],PRO=[],FOR=[],KNOTS=[];
let solo=-1, query='', matches=null, sel=null, hov=null, view='coil';
const cam={t:tauOf(2031.5),d:36,w:0.34,p:0.14}, goal={...cam};
let zoomK=1, dirty=true, tour=null, lastWin='', userMoved=false;
const baseD=t=>t<0?30+4*(-t):t>TNOW?36:20+1.3*Rr(t);

const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
let W=1,H=1,DPR=1;

Promise.resolve().then(()=>JSON.parse($('coil-data').textContent)).then(init).catch(e=>{$('panel').innerHTML='<p class="err">The record could not be read ('+esc(e.message)+').</p>';});

function init(rows){
  DATA=rows.map((r,i)=>({...r,id:i,tau:tauOf(r.y)}));
  HIS=DATA.filter(r=>r.k==='h'); PRO=DATA.filter(r=>r.k==='p'); FOR=DATA.filter(r=>r.k==='f').sort((a,b)=>a.s-b.s||a.y-b.y);
  KNOTS=DATA.filter(r=>r.k!=='f');
  placeKnots(); buildStrands(); buildLegend(); buildTicks(); buildLedger();
  new ResizeObserver(resize).observe(stage); resize();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;drawHist();});
  if(location.hash==='#ledger')setView('ledger');
  renderPanel(true);
  requestAnimationFrame(loop);
}

function placeKnots(){
  const AMP={s:.15,l:.45,p:.85,x:1.35};
  for(let s=0;s<8;s++){
    const list=KNOTS.filter(r=>r.c===s).sort((a,b)=>a.tau-b.tau), placed=[];
    for(const r of list){
      const base=strandAt(s,r.tau), out=norm(sub(base,centerAt(r.tau)));
      let p0=base;
      if(r.k==='p'){seed=r.id*97+13;const j=randUnit();p0=add(base,mul(j,AMP[r.r]*(0.5+0.8*fray(r.tau))));}
      let pos=p0;
      for(let k=0;k<16;k++){pos=add(p0,mul(out,k*0.5));let ok=true;for(let i=placed.length-1;i>=0&&i>=placed.length-40;i--){const q=placed[i];const dx=q[0]-pos[0],dy=q[1]-pos[1],dz=q[2]-pos[2];if(dx*dx+dy*dy+dz*dz<0.25){ok=false;break;}}if(ok)break;}
      placed.push(pos); r.pos=pos; r.base=base;
    }
  }
  const byY={};
  for(const f of FOR){ if(f.y<Y0)continue; const n=byY[f.y]=(byY[f.y]||0)+1; const g=gt(tauOf(f.y)), fr=frame(g); f.pos=add(C(g),mul(fr.T,(n-1)*0.6)); }
}

let STR=[], RINGS=[], FRINGS=[], LABELS=[];
function buildStrands(){
  STR=[];
  for(let s=0;s<8;s++){
    const pts=[];
    for(let i=0;i<=200;i++){const u=UMAX*(1-i/200);pts.push({p:strandAt(s,-u),t:-u});}
    for(let i=1;i<=1000;i++){const t=i/100;pts.push({p:strandAt(s,t),t});}
    for(let i=1;i<=40;i++){const t=TNOW+(TMAX-TNOW)*i/40;pts.push({p:strandAt(s,t),t});}
    STR.push(pts);
  }
  /* loose fibres in the projected decade */
  for(let s=0;s<8;s++)for(let k=0;k<2;k++){
    seed=s*31+k*7+3;const off=randUnit(), pts=[];
    for(let i=0;i<=40;i++){const t=TNOW+(TMAX-TNOW)*i/40;pts.push({p:add(strandAt(s,t),mul(off,2.2*fray(t))),t});}
    STR.push(pts);
  }
  RINGS=[];
  for(const y of [1,-1000,-10000,-100000,-1000000,-3300000]){
    const u=U(y), c=rootC(u), r=rootR(u)+0.8, pts=[];
    for(let i=0;i<=72;i++){const a=TAU*i/72;pts.push(add(c,add(mul(E1,r*Math.cos(a)),mul(E2,r*Math.sin(a)))));}
    RINGS.push({y,pts,top:add(c,mul(E2,r+0.9))});
  }
  FRINGS=[];
  for(let y=2027;y<=2036;y++){const t=tauOf(y),g=gt(t),c=C(g),f=frame(g),r=tubeR(t)+0.55,pts=[];for(let i=0;i<=56;i++){const a=TAU*i/56;pts.push(add(c,add(mul(f.N,r*Math.cos(a)),mul(f.B,r*Math.sin(a)))));}FRINGS.push({y,pts});}
  LABELS=[];
  for(let y=1100;y<=2000;y+=100){const t=tauOf(y);LABELS.push({txt:String(y),p:add(C(t),mul(frame(t).N,RT+2.2)),col:MUTE});}
  LABELS.push({txt:'1026',p:add(C(0),mul(F0.N,RT+2.2)),col:MUTE});
  LABELS.push({txt:'2026 today',p:add(C(TNOW),mul(frame(TNOW).N,RT+2.2)),col:INK});
  LABELS.push({txt:'2030',p:add(C(gt(tauOf(2030))),mul(frame(gt(tauOf(2030))).N,tubeR(tauOf(2030))+1.4)),col:ICE});
  LABELS.push({txt:'2036',p:add(C(gt(TMAX)),mul(frame(gt(TMAX)).N,tubeR(TMAX)+1.4)),col:ICE});
}

/* camera */
function basis(){
  const t=cam.t, a=t>=0?ang(gt(t)):A0, F=centerAt(t);
  const r=[Math.cos(a),Math.sin(a),0], yv=[-Math.sin(a),Math.cos(a),0], z=[0,0,1];
  const dir=add(mul(add(mul(r,Math.cos(cam.w)),mul(z,Math.sin(cam.w))),Math.cos(cam.p)),mul(yv,-Math.sin(cam.p)));
  const pos=add(F,mul(dir,cam.d)), fwd=mul(dir,-1);
  let up=mul(yv,-1); up=norm(sub(up,mul(fwd,dot(up,fwd))));
  return {pos,fwd,up,right:cross(fwd,up),F};
}
let B=null, FPX=1, CX=0, CY=0;
function P(p){
  const vx=p[0]-B.pos[0],vy=p[1]-B.pos[1],vz=p[2]-B.pos[2];
  const z=vx*B.fwd[0]+vy*B.fwd[1]+vz*B.fwd[2]; if(z<0.6)return null;
  const x=vx*B.right[0]+vy*B.right[1]+vz*B.right[2], y=vx*B.up[0]+vy*B.up[1]+vz*B.up[2];
  return [CX+FPX*x/z, CY-FPX*y/z, z];
}
const fog=z=>clamp(1.2-(z-cam.d*0.7)/(cam.d*2.4),0.1,1);

function resize(){
  const r=stage.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); dirty=true; drawHist(); placeThumb(); if(DATA.length){buildTicks();measureObst();}
}

function lineageAlpha(c){return solo<0||solo===c?1:0.12;}
function knotAlpha(r){let a=lineageAlpha(r.c);if(matches&&!matches.has(r.id))a*=0.15;return a;}

let HITS=[], OBST=[];
function measureObst(){
  const sr=stage.getBoundingClientRect(), box=e=>{const r=e.getBoundingClientRect();return {x:r.left-sr.left-4,y:r.top-sr.top-4,w:r.width+8,h:r.height+8};};
  OBST=[...$('legend').children,$('yr').firstElementChild,$('yr').lastElementChild,$('tour'),$('hint')].filter(e=>e&&e.offsetParent!==null).map(box).filter(o=>o.w>8&&o.h>8);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  B=basis(); FPX=(H*0.5)/Math.tan(26*Math.PI/180); {const k=clamp((cam.t-8.6)/1.5,0,1);CX=W*(0.5+(W>700?0.12:0.05)*k*k*(3-2*k));} CY=H*0.44;
  const prims=[];
  /* strands */
  STR.forEach((pts,si)=>{
    const s=si<8?si:Math.floor((si-8)/2), fibre=si>=8, col=LIN[s].c, la=lineageAlpha(s);
    let chunk=[],zs=0,fut=false;
    const flush=()=>{if(chunk.length>1)prims.push({z:zs/chunk.length,k:0,pts:chunk,col,la,fut,fibre});chunk=[];zs=0;};
    for(let i=0;i<pts.length;i++){
      const q=P(pts[i].p); if(!q){flush();continue;}
      const f=pts[i].t>TNOW+1e-6;
      if(f!==fut&&chunk.length){chunk.push(q);zs+=q[2];flush();fut=f;}
      fut=f; chunk.push(q); zs+=q[2];
      if(chunk.length>=7){const last=chunk[chunk.length-1];flush();chunk.push(last);zs=last[2];}
    }
    flush();
  });
  /* rings of deep time */
  for(const R of RINGS){let chunk=[],zs=0;for(const p of R.pts){const q=P(p);if(!q){chunk=[];zs=0;continue;}chunk.push(q);zs+=q[2];if(chunk.length>=7){prims.push({z:zs/chunk.length,k:1,pts:chunk});const l=chunk[chunk.length-1];chunk=[l];zs=l[2];}}if(chunk.length>1)prims.push({z:zs/chunk.length,k:1,pts:chunk});}
  /* the cone of possibility: one ring per projected year */
  for(const R of FRINGS){const strong=Math.floor(yearOf(cam.t)+1e-6)===R.y&&cam.t>TNOW;let chunk=[],zs=0;for(const p of R.pts){const q=P(p);if(!q){chunk=[];zs=0;continue;}chunk.push(q);zs+=q[2];if(chunk.length>=7){prims.push({z:zs/chunk.length,k:5,pts:chunk,strong});const l=chunk[chunk.length-1];chunk=[l];zs=l[2];}}if(chunk.length>1)prims.push({z:zs/chunk.length,k:5,pts:chunk,strong});}
  /* focus ring */
  {const t=cam.t;if(t>=0&&t<=TNOW+1e-4){const g=gt(t),c=C(g),f=frame(g),r=tubeR(t)+0.9;let chunk=[],zs=0;for(let i=0;i<=48;i++){const a=TAU*i/48;const q=P(add(c,add(mul(f.N,r*Math.cos(a)),mul(f.B,r*Math.sin(a)))));if(!q){chunk=[];continue;}chunk.push(q);zs+=q[2];if(chunk.length>=7){prims.push({z:zs/chunk.length,k:2,pts:chunk});const l=chunk[chunk.length-1];chunk=[l];zs=l[2];}}if(chunk.length>1)prims.push({z:zs/chunk.length,k:2,pts:chunk});}}
  /* knots and tethers */
  for(const r of KNOTS){
    const q=P(r.pos); if(!q)continue;
    const rad=FPX*(r.m?BR*1.35:BR)/q[2]; if(rad<0.35)continue;
    let tb=null; if(r.k==='p'){tb=P(r.base);}
    prims.push({z:q[2],k:3,r,x:q[0],y:q[1],rad,tb});
  }
  /* forecasts on the core line */
  for(const f of FOR){if(!f.pos)continue;const q=P(f.pos);if(!q)continue;const s=FPX*0.2/q[2];if(s<0.6)continue;prims.push({z:q[2],k:4,f,x:q[0],y:q[1],s});}
  prims.sort((a,b)=>b.z-a.z);
  HITS=[];
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const pr of prims){
    const fa=fog(pr.z);
    if(pr.k===0){
      const a=fa*pr.la*(pr.fibre?0.35:pr.fut?0.75:0.62);
      ctx.strokeStyle=rgba(pr.col,a); ctx.lineWidth=clamp(FPX*(pr.fibre?0.035:0.075)/pr.z,0.5,3);
      ctx.setLineDash(pr.fut?[5,5]:[]);
      ctx.beginPath(); ctx.moveTo(pr.pts[0][0],pr.pts[0][1]); for(let i=1;i<pr.pts.length;i++)ctx.lineTo(pr.pts[i][0],pr.pts[i][1]); ctx.stroke();
    }else if(pr.k===5){
      ctx.strokeStyle=rgba(ICE,(pr.strong?0.62:0.3)*fa); ctx.lineWidth=pr.strong?1.6:1.1; ctx.setLineDash(pr.strong?[4,4]:[2,4]);

let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;

{
  let pd=null, pts=new Map(), pinch=0;
  const nearest=(x,y)=>{let best=null,bd=1e9;for(const h of HITS){if(h.a<0.3)continue;const dx=h.x-x,dy=h.y-y,d=Math.hypot(dx,dy)-h.rad;const lim=Math.max(9,h.rad+5);if(d<lim&&d<bd){bd=d;best=h;}}return best;};
  const tip=$('tip');
  const showTip=(h,x,y)=>{if(!h){tip.hidden=true;return;}const r=h.r;let a,b;
    if(r.k==='f'){a=r.by+' ('+r.s+')';b=OUT[r.o].n+(r.nd?' · judged by ':' · due ')+r.y;}else if(r.k==='p'){a=r.t;b='Projected for '+r.y+' · '+TIER[r.r].n;}else{a=r.t;b=fmtY(r.y)+' · '+LIN[r.c].n;}
    tip.innerHTML=`<b>${esc(a)}</b><small>${esc(b)}</small>`;tip.hidden=false;
    const tw_=tip.offsetWidth,th=tip.offsetHeight;tip.style.left=clamp(x+14,6,W-tw_-6)+'px';tip.style.top=clamp(y-th-12,6,H-th-6)+'px';};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)pd={x:e.clientX,y:e.clientY,w:goal.w,p:goal.p,moved:false};else if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);pd=null;}});
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(pts.has(e.pointerId))pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomK=clamp(zoomK*pinch/d,0.3,2.8);pinch=d;goal.d=baseD(goal.t)*zoomK;return;}
    if(pd){const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(!pd.moved&&Math.hypot(dx,dy)>4){pd.moved=true;cv.classList.add('drag');tip.hidden=true;tour=null;resetTourBtn();}
      if(pd.moved){goal.w=clamp(pd.w-dx*0.006,-1.45,1.45);goal.p=clamp(pd.p+dy*0.005,-1.1,1.1);cam.w=goal.w;cam.p=goal.p;dirty=true;}return;}
    const h=nearest(x,y);const id=h?h.r.id:null;if((hov&&hov.id)!==id){hov=h?h.r:null;dirty=true;}cv.classList.toggle('hov',!!h);showTip(h,x,y);
  });
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;cv.classList.remove('drag');
    if(pd&&!pd.moved&&e.type==='pointerup'){const r=cv.getBoundingClientRect();const h=nearest(e.clientX-r.left,e.clientY-r.top);if(h)select(h.r,true);else if(sel){sel=null;dirty=true;renderPanel();}}
    if(pts.size===0)pd=null;};
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{if(!pd){hov=null;tip.hidden=true;dirty=true;}});
  cv.addEventListener('wheel',e=>{e.preventDefault();zoomK=clamp(zoomK*Math.exp(e.deltaY*0.0012),0.3,2.8);goal.d=baseD(goal.t)*zoomK;},{passive:false});
  cv.addEventListener('keydown',e=>{let used=true;userMoved=true;if(e.key==='ArrowRight')goal.t=pToT(tToP(goal.t)+0.01);else if(e.key==='ArrowLeft')goal.t=pToT(tToP(goal.t)-0.01);else if(e.key==='+'||e.key==='=')zoomK=clamp(zoomK*0.85,0.3,2.8);else if(e.key==='-')zoomK=clamp(zoomK/0.85,0.3,2.8);else if(e.key==='Escape'){sel=null;renderPanel();}else used=false;if(used){e.preventDefault();goal.d=baseD(goal.t)*zoomK;dirty=true;}});
}

/* tour */
function resetTourBtn(){$('tour').querySelector('span').textContent='Fly from 3.3M BCE';}
$('tour').addEventListener('click',()=>{if(tour){tour=null;resetTourBtn();return;}sel=null;userMoved=true;tour={t0:performance.now(),dur:30000};cam.t=goal.t=-UMAX;goal.d=baseD(goal.t)*zoomK;$('tour').querySelector('span').textContent='Stop';dirty=true;});

/* search */
$('q').addEventListener('input',e=>{
  query=e.target.value.trim(); const q=query.toLowerCase();
  matches=q?new Set(DATA.filter(r=>[r.t,r.d,r.by,r.b,r.n,LIN[r.c]?.n].some(v=>v&&String(v).toLowerCase().includes(q))).map(r=>r.id)):null;
  dirty=true; renderPanel(); if(view==='ledger')filterLedger();
});

/* ledger view */
function setView(v){view=v;$('vCoil').setAttribute('aria-pressed',v==='coil');$('vLedger').setAttribute('aria-pressed',v==='ledger');
  $('stage').hidden=v!=='coil';$('panel').hidden=v!=='coil';$('ledger').hidden=v!=='ledger';
  try{history.replaceState(null,'',v==='ledger'?'#ledger':location.pathname+location.search);}catch(e){}
  if(v==='coil'){resize();}else filterLedger();}
$('vCoil').addEventListener('click',()=>setView('coil'));
$('vLedger').addEventListener('click',()=>setView('ledger'));
window.addEventListener('hashchange',()=>setView(location.hash==='#ledger'?'ledger':'coil'));
function link(r){const s=srcOf(r);return s?`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(host(s))}</a>`:'';}
function buildLedger(){
  const pro=[...PRO].sort((a,b)=>a.y-b.y||a.c-b.c);
  const tally=Object.keys(TIER).map(k=>`${PRO.filter(r=>r.r===k).length} ${TIER[k].n.toLowerCase()}`).join(', ');
  const outs=Object.keys(OUT).map(k=>[k,FOR.filter(f=>f.o===k).length]).filter(x=>x[1]).map(([k,n])=>`${n} ${OUT[k].n.toLowerCase()}`).join(', ');
  $('ledger').innerHTML=`<h2>The ledger</h2><p class="lede">Every knot on the coil as a table: the projected decade first, then a century of forecasts checked against what happened, then the full record.</p>
  <h3>The projected decade, 2027 to 2036</h3><p class="lede">${PRO.length} milestones: ${tally}. Each rests on a plan, a roadmap or a measured trend; where the basis is a trend, the year is an extrapolation made for this page.</p>
  <div class="tw"><table class="stack"><thead><tr><th>Year</th><th>Milestone</th><th>Lineage</th><th>Confidence</th><th>Rests on</th><th>Source</th></tr></thead><tbody>${pro.map(r=>`<tr><td class="n" data-l="Year">${r.y}</td><td data-l="Milestone"><b>${esc(r.t)}</b><br><span style="color:var(--ink2)">${esc(r.d)}</span></td><td data-l="Lineage"><span class="badge"><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="${LIN[r.c].c}"/></svg>${LIN[r.c].n}</span></td><td data-l="Confidence"><span class="badge">${tierIcon(r.r,ICE)} ${TIER[r.r].n}</span></td><td data-l="Rests on">${esc(r.b)}</td><td data-l="Source">${link(r)}</td></tr>`).join('')}</tbody></table></div>
  <h3>Forecasts, then and now</h3><p class="lede">${FOR.length} dated predictions: ${outs}.</p>
  <div class="tw"><table class="stack"><thead><tr><th>Said</th><th>Who</th><th>Forecast</th><th>Due</th><th>Outcome</th><th>Source</th></tr></thead><tbody>${FOR.map(f=>`<tr><td class="n" data-l="Said">${f.s}</td><td data-l="Who">${esc(f.by)}</td><td data-l="Forecast">${esc(f.t)}</td><td class="n" data-l="Due">${f.nd?'—':f.y}</td><td data-l="Outcome"><span class="out" style="color:${OUT[f.o].c}">${outIcon(f.o)} ${OUT[f.o].n}</span><br><span style="color:var(--ink2)">${esc(f.n)}</span></td><td data-l="Source">${link(f)}</td></tr>`).join('')}</tbody></table></div>
  <h3>The full record</h3><p class="lede" id="ledN">${HIS.length} records from 3.3 million BCE to 2026. The search box above filters this table.</p>
  <div class="tw"><table class="stack"><thead><tr><th>Year</th><th>Event</th><th>Lineage</th><th>Source</th></tr></thead><tbody id="ledAll">${[...HIS].sort((a,b)=>a.y-b.y).map(r=>`<tr data-id="${r.id}"><td class="n" data-l="Year">${esc(fmtY(r.y))}</td><td data-l="Event"><b>${esc(r.t)}</b><br><span style="color:var(--ink2)">${esc(r.d)}</span></td><td data-l="Lineage"><span class="badge"><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="${LIN[r.c].c}"/></svg>${LIN[r.c].n}</span></td><td data-l="Source">${link(r)}</td></tr>`).join('')}</tbody></table></div>`+ABOUT;
}
function filterLedger(){const rows=document.querySelectorAll('#ledAll tr');let n=0;rows.forEach(tr=>{const ok=!matches||matches.has(+tr.dataset.id);tr.hidden=!ok;if(ok)n++;});$('ledN').textContent=matches?`${n} of ${HIS.length} records match “${query}”.`:`${HIS.length} records from 3.3 million BCE to 2026. The search box above filters this table.`;}
}
</script>
</body>
