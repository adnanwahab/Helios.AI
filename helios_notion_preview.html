<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helios.AI — The Plan</title>
  <meta name="description" content="The Helios plan as one document: every wish people wrote, turned into proposals you can read, vote on, and edit.">
  <link rel="canonical" href="https://helioshtml.com/notion">
  <!-- Link previews: iMessage, SMS, Slack, Discord, Facebook, LinkedIn, X -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Helios.AI">
  <meta property="og:title" content="Helios.AI — The Plan">
  <meta property="og:description" content="The Helios plan as one document: every wish people wrote, turned into proposals you can read, vote on, and edit.">
  <meta property="og:url" content="https://helioshtml.com/notion">
  <meta property="og:image" content="https://helioshtml.com/public/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A journal wish, &ldquo;Please build a bridge from New York to France,&rdquo; becomes the Transatlantic Connection Initiative.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Helios.AI — The Plan">
  <meta name="twitter:description" content="The Helios plan as one document: every wish people wrote, turned into proposals you can read, vote on, and edit.">
  <meta name="twitter:image" content="https://helioshtml.com/public/og.png">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #ffffff; --side: #f7f7f5; --ink: #37352f; --muted: #787774; --faint: #9b9a97; --line: rgba(55,53,47,.09);
      --hover: rgba(55,53,47,.06); --code-bg: rgba(135,131,120,.15); --code-ink: #eb5757; --accent: #2383e2;
      --gray: #787774; --brown: #9f6b53; --orange: #d9730d; --yellow: #cb912f; --green: #448361; --blue: #337ea9; --purple: #9065b0; --pink: #c14c8a; --red: #d44c47;
      --gray-bg: #f1f1ef; --brown-bg: #f4eeee; --orange-bg: #fbecdd; --yellow-bg: #fbf3db; --green-bg: #edf3ec; --blue-bg: #e7f3f8; --purple-bg: #f6f3f9; --pink-bg: #faf1f5; --red-bg: #fdebec;
      --mark: #fff3a8;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #191919; --side: #202020; --ink: rgba(255,255,255,.81); --muted: rgba(255,255,255,.46); --faint: rgba(255,255,255,.32); --line: rgba(255,255,255,.094);
      --hover: rgba(255,255,255,.055); --code-bg: rgba(135,131,120,.15); --code-ink: #ff7369; --accent: #529cca;
      --gray: #9b9b9b; --brown: #ba856f; --orange: #c77d48; --yellow: #ca9849; --green: #529e72; --blue: #5e87c9; --purple: #9d68d3; --pink: #d15796; --red: #df5452;
      --gray-bg: #2f2f2f; --brown-bg: #4a3228; --orange-bg: #5c3b23; --yellow-bg: #56452f; --green-bg: #243d30; --blue-bg: #143a4e; --purple-bg: #3c2d49; --pink-bg: #4e2c3c; --red-bg: #522e2a;
      --mark: #5c4a12;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { display: grid; grid-template-columns: 248px minmax(0, 1fr); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    body.sidebar-hidden { grid-template-columns: 0 minmax(0, 1fr); }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    /* ---------- sidebar ---------- */
    .sidebar { background: var(--side); border-right: 1px solid var(--line); height: 100vh; overflow: hidden; display: flex; flex-direction: column; position: sticky; top: 0; transition: width .2s; }
    body.sidebar-hidden .sidebar { visibility: hidden; }
    .workspace { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-size: 14px; font-weight: 600; }
    .ws-icon { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; background: linear-gradient(135deg, #ffd36e, #ff9a3c); font-size: 13px; }
    .side-item { display: flex; align-items: center; gap: 8px; margin: 1px 6px; padding: 4px 10px; border-radius: 6px; font-size: 14px; color: var(--muted); border: 0; background: transparent; text-align: left; width: calc(100% - 12px); }
    .side-item:hover { background: var(--hover); }
    .side-item kbd { margin-left: auto; font: 11px ui-monospace, monospace; color: var(--faint); }
    .side-label { font-size: 12px; font-weight: 600; color: var(--faint); padding: 16px 16px 4px; }
    .outline { overflow: auto; flex: 1; padding-bottom: 12px; }
    .outline button { display: block; width: calc(100% - 12px); margin: 0 6px; padding: 3px 10px; border: 0; background: transparent; border-radius: 6px; text-align: left; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .outline button:hover { background: var(--hover); color: var(--ink); }
    .outline button.lvl-2 { padding-left: 24px; }
    .outline button.lvl-3 { padding-left: 38px; font-size: 13px; }
    .outline button.active { color: var(--ink); font-weight: 600; }
    .side-foot { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--faint); line-height: 1.5; }

    /* ---------- topbar ---------- */
    .main { height: 100vh; overflow: auto; position: relative; }
    .topbar { position: sticky; top: 0; z-index: 10; height: 45px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); }
    .crumbs { display: flex; align-items: center; gap: 4px; font-size: 14px; min-width: 0; flex: 1; }
    .crumbs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumbs .sep { color: var(--faint); }
    .icon-btn, .tb-btn { border: 0; background: transparent; border-radius: 6px; padding: 4px 8px; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; }
    .icon-btn:hover, .tb-btn:hover { background: var(--hover); color: var(--ink); }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
    .badge.live { background: var(--green-bg); color: var(--green); }
    .badge.preview { background: var(--yellow-bg); color: var(--yellow); }
    .badge.loading { background: var(--gray-bg); color: var(--gray); }
    .synced { font-size: 12px; color: var(--faint); white-space: nowrap; }
    .spin { animation: spin .8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- page ---------- */
    .cover { height: 30vh; min-height: 160px; max-height: 280px; background: linear-gradient(120deg, #ffcf6b 0%, #ff8a5b 35%, #c86dd7 70%, #5b8def 100%); background-size: cover; background-position: center 40%; position: relative; }
    .cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 78% 30%, rgba(255,255,255,.55) 0 6%, transparent 22%); }
    .page { max-width: 900px; margin: 0 auto; padding: 0 96px 30vh; position: relative; }
    body.full-width .page { max-width: none; }
    .page-icon { font-size: 78px; line-height: 1; margin-top: -42px; position: relative; z-index: 1; user-select: none; }
    .no-cover .page-icon { margin-top: 60px; }
    h1.title { font-size: 40px; line-height: 1.2; font-weight: 700; margin: 18px 0 8px; letter-spacing: -.01em; }
    .props { margin: 8px 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    .prop { display: grid; grid-template-columns: 170px 1fr; align-items: center; min-height: 34px; font-size: 14px; }
    .prop-name { color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .prop-value { padding: 4px 8px; border-radius: 4px; }
    .prop-value .tag { background: var(--gray-bg); padding: 1px 7px; border-radius: 3px; }
    .banner { margin: 10px 0 4px; padding: 10px 14px; border-radius: 6px; background: var(--yellow-bg); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
    .banner code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }

    /* ---------- blocks ---------- */
    .blocks > *, .children > * { margin: 2px 0; }
    .b { padding: 3px 2px; min-height: 1.5em; white-space: pre-wrap; word-break: break-word; border-radius: 3px; }
    .b.hit { background: var(--mark); }
    h2.b, h3.b, h4.b { font-weight: 600; line-height: 1.3; scroll-margin-top: 60px; }
    h2.b { font-size: 1.875em; margin: 1.6em 0 4px; }
    h3.b { font-size: 1.5em; margin: 1.3em 0 2px; }
    h4.b { font-size: 1.25em; margin: 1em 0 1px; }
    ul.list, ol.list { margin: 0; padding-left: 1.7em; }
    ul.list > li, ol.list > li { padding: 3px 2px; }
    ul.list > li::marker { font-size: 1.1em; }
    ul.list ul.list > li { list-style-type: circle; }
    .todo { display: flex; gap: 8px; align-items: flex-start; padding: 3px 2px; }
    .todo .box { width: 16px; height: 16px; margin-top: 4px; border: 1.5px solid var(--ink); border-radius: 2px; flex: 0 0 16px; display: grid; place-items: center; font-size: 12px; cursor: pointer; background: transparent; padding: 0; }
    .todo.done .box { background: var(--accent); border-color: var(--accent); color: #fff; }
    .todo.done .txt { text-decoration: line-through; color: var(--faint); }
    details.toggle > summary { list-style: none; display: flex; gap: 4px; align-items: flex-start; padding: 3px 2px; cursor: pointer; border-radius: 4px; }
    details.toggle > summary::-webkit-details-marker { display: none; }
    details.toggle > summary:hover { background: var(--hover); }
    details.toggle > summary .tri { flex: 0 0 22px; height: 24px; display: grid; place-items: center; transition: transform .15s; color: var(--ink); font-size: 11px; }
    details.toggle[open] > summary .tri { transform: rotate(90deg); }
    details.toggle > .children { padding-left: 26px; }
    .callout { display: flex; gap: 10px; padding: 14px 16px 14px 12px; border-radius: 4px; background: var(--gray-bg); margin: 4px 0; }
    .callout .c-icon { font-size: 20px; line-height: 1.2; flex: 0 0 24px; text-align: center; }
    .callout .c-body { min-width: 0; flex: 1; white-space: pre-wrap; }
    blockquote.b { margin: 6px 0; padding: 3px 14px; border-left: 3px solid currentColor; font-size: 1.1em; }
    hr.div { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    pre.code { background: var(--side); padding: 30px 16px 16px; border-radius: 4px; font: 13.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: auto; position: relative; }
    pre.code .lang { position: absolute; top: 6px; left: 14px; font: 12px ui-sans-serif, system-ui; color: var(--faint); }
    figure.img { margin: 8px 0; } figure.img img { max-width: 100%; border-radius: 3px; } figure.img figcaption { font-size: 14px; color: var(--muted); padding-top: 6px; }
    a.bookmark { display: block; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; text-decoration: none; font-size: 14px; margin: 4px 0; }
    a.bookmark:hover { background: var(--hover); } a.bookmark small { display: block; color: var(--muted); margin-top: 2px; }
    table.tbl { border-collapse: collapse; margin: 8px 0; font-size: 14px; width: 100%; }
    table.tbl td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; }
    table.tbl tr.head td { background: var(--side); font-weight: 600; }
    .page-link { display: flex; gap: 6px; padding: 3px 2px; text-decoration: underline; text-decoration-color: var(--line); }
    .unsupported { color: var(--faint); font-size: 14px; font-style: italic; }
    .r-code { font: .85em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); color: var(--code-ink); padding: .2em .4em; border-radius: 4px; }
    .r-link { text-decoration: underline; text-decoration-color: var(--faint); }
    .fg-gray { color: var(--gray); } .fg-brown { color: var(--brown); } .fg-orange { color: var(--orange); } .fg-yellow { color: var(--yellow); } .fg-green { color: var(--green); } .fg-blue { color: var(--blue); } .fg-purple { color: var(--purple); } .fg-pink { color: var(--pink); } .fg-red { color: var(--red); }
    .bg-gray { background: var(--gray-bg); } .bg-brown { background: var(--brown-bg); } .bg-orange { background: var(--orange-bg); } .bg-yellow { background: var(--yellow-bg); } .bg-green { background: var(--green-bg); } .bg-blue { background: var(--blue-bg); } .bg-purple { background: var(--purple-bg); } .bg-pink { background: var(--pink-bg); } .bg-red { background: var(--red-bg); }

    .skeleton { height: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--gray-bg), var(--side), var(--gray-bg)); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin: 12px 0; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ---------- search palette ---------- */
    .palette-back { position: fixed; inset: 0; background: rgba(15,15,15,.45); display: none; z-index: 50; align-items: flex-start; justify-content: center; padding-top: 12vh; }
    .palette-back.open { display: flex; }
    .palette { width: min(620px, 92vw); background: var(--bg); border-radius: 10px; box-shadow: 0 16px 70px rgba(0,0,0,.3); overflow: hidden; border: 1px solid var(--line); }
    .palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; font-size: 18px; background: transparent; color: var(--ink); outline: 0; }
    .results { max-height: 50vh; overflow: auto; padding: 6px; }
    .result { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 8px 12px; font-size: 14px; }
    .result small { display: block; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result.sel, .result:hover { background: var(--hover); }
    .result mark { background: var(--mark); color: inherit; border-radius: 2px; }
    .palette .hint { padding: 8px 14px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); }

    .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: #2f2f2f; color: #fff; font-size: 14px; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      body { grid-template-columns: 0 minmax(0, 1fr); }
      .sidebar { visibility: hidden; position: fixed; width: 260px; z-index: 40; box-shadow: 0 0 40px rgba(0,0,0,.2); }
      body.sidebar-open .sidebar { visibility: visible; }
      .page { padding: 0 22px 30vh; }
      .prop { grid-template-columns: 130px 1fr; }
      .synced, .tb-label { display: none; }
      h1.title { font-size: 32px; }
    }
    @media print { .sidebar, .topbar { display: none; } body { display: block; } .main { height: auto; overflow: visible; } details.toggle > .children { display: block !important; } }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="Workspace">
    <div class="workspace"><span class="ws-icon">☀️</span> Helios.AI</div>
    <button class="side-item" id="side-search" type="button">🔍 Search <kbd>⌘K</kbd></button>
    <button class="side-item" id="side-refresh" type="button">🔄 Sync from Notion</button>
    <button class="side-item" id="side-md" type="button">⬇️ Export Markdown</button>
    <div class="side-label">On this page</div>
    <nav class="outline" id="outline" aria-label="Outline"></nav>
    <div class="side-foot" id="side-foot">Loading…</div>
  </aside>

  <div class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle-sidebar" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
      <div class="crumbs"><span>☀️ Helios.AI</span><span class="sep">/</span><span id="crumb-title">Plan</span></div>
      <span class="badge loading" id="badge">Loading</span>
      <span class="synced" id="synced"></span>
      <button class="tb-btn" id="expand" type="button" title="Expand or collapse every toggle">⇅ <span class="tb-label">Expand all</span></button>
      <button class="tb-btn" id="copy-link" type="button" title="Copy link">🔗</button>
      <button class="tb-btn" id="theme" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
      <button class="tb-btn" id="width" type="button" title="Full width">↔</button>
      <a class="tb-btn" id="open-notion" target="_blank" rel="noopener noreferrer" hidden>Open in Notion ↗</a>
    </header>

    <div id="cover" class="cover"></div>
    <article class="page" id="page">
      <div class="page-icon" id="page-icon">☀️</div>
      <h1 class="title" id="title">Helios Plan</h1>
      <div id="banner"></div>
      <div class="props" id="props"></div>
      <div class="blocks" id="blocks">
        <div class="skeleton" style="width:72%"></div><div class="skeleton"></div><div class="skeleton" style="width:88%"></div><div class="skeleton" style="width:55%"></div>
      </div>
    </article>
  </div>

  <div class="palette-back" id="palette-back" role="dialog" aria-modal="true" aria-label="Search this page">
    <div class="palette">
      <input id="palette-input" type="search" placeholder="Search the Helios plan…" autocomplete="off">
      <div class="results" id="results"></div>
      <div class="hint">↑↓ to move · Enter to jump · Esc to close</div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const safeUrl = u => { try { const x = new URL(u, location.href); return ['http:', 'https:', 'mailto:'].includes(x.protocol) ? x.href : null; } catch { return null; } };
    const plain = rich => (rich || []).map(r => r.text).join('');
    const colorClass = c => !c || c === 'default' ? '' : c.endsWith('_background') ? 'bg-' + c.replace('_background', '') : 'fg-' + c;
    const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

    let doc = null, meta = {}, index = [], seq = 0;
    const todoKey = 'helios-notion-todos';
    let todoState = {}; try { todoState = JSON.parse(store(todoKey) || '{}'); } catch {}

    // ---------- theme / layout ----------
    const setTheme = t => { document.documentElement.dataset.theme = t; $('theme').textContent = t === 'dark' ? '☀️' : '🌙'; store('helios-notion-theme', t); };
    setTheme(store('helios-notion-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    $('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    $('width').onclick = () => document.body.classList.toggle('full-width');
    $('toggle-sidebar').onclick = () => document.body.classList.toggle(innerWidth <= 900 ? 'sidebar-open' : 'sidebar-hidden');

    function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

    // ---------- rendering ----------
    function richHTML(rich) {
      return (rich || []).map(r => {
        let h = esc(r.text);
        if (r.code) h = `<code class="r-code">${h}</code>`;
        if (r.bold) h = `<strong>${h}</strong>`;
        if (r.italic) h = `<em>${h}</em>`;
        if (r.strike) h = `<s>${h}</s>`;
        if (r.underline) h = `<u>${h}</u>`;
        const cls = colorClass(r.color);
        if (cls) h = `<span class="${cls}">${h}</span>`;
        const href = r.href && safeUrl(r.href);
        if (href) h = `<a class="r-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${h}</a>`;
        return h;
      }).join('');
    }

    function register(b, level) {
      const id = 'b' + (++seq);
      index.push({id, text: plain(b.rich), level, type: b.type});
      return id;
    }

    function renderBlocks(blocks, depth = 0) {
      let html = '', i = 0;
      while (i < blocks.length) {
        const b = blocks[i];
        if (b.type === 'bulleted_list_item' || b.type === 'numbered_list_item') {
          const tag = b.type === 'bulleted_list_item' ? 'ul' : 'ol';
          html += `<${tag} class="list">`;
          while (i < blocks.length && blocks[i].type === b.type) { html += `<li>${renderInner(blocks[i], depth)}</li>`; i++; }
          html += `</${tag}>`;
          continue;
        }
        html += renderBlock(b, depth); i++;
      }
      return html;
    }

    function renderInner(b, depth) {
      const id = register(b, 0);
      return `<span class="b" id="${id}">${richHTML(b.rich)}</span>${b.children?.length ? renderBlocks(b.children, depth + 1) : ''}`;
    }

    function renderBlock(b, depth) {
      const kids = b.children?.length ? renderBlocks(b.children, depth + 1) : '';
      const color = colorClass(b.color);
      switch (b.type) {
        case 'heading_1': case 'heading_2': case 'heading_3': {
          const lvl = Number(b.type.slice(-1)), id = register(b, lvl), tag = 'h' + (lvl + 1);
          const head = `<${tag} class="b ${color}" id="${id}">${richHTML(b.rich)}</${tag}>`;
          return b.toggleable ? `<details class="toggle"><summary><span class="tri">▶</span>${head}</summary><div class="children">${kids}</div></details>` : head + kids;
        }
        case 'paragraph': { const id = register(b, 0); return `<p class="b ${color}" id="${id}">${richHTML(b.rich) || '&nbsp;'}</p>${kids ? `<div class="children" style="padding-left:26px">${kids}</div>` : ''}`; }
        case 'toggle': { const id = register(b, 0); return `<details class="toggle" data-id="${id}"><summary><span class="tri">▶</span><span class="b ${color}" id="${id}">${richHTML(b.rich)}</span></summary><div class="children">${kids}</div></details>`; }
        case 'to_do': {
          const id = register(b, 0), key = b.id || plain(b.rich), done = key in todoState ? todoState[key] : b.checked;
          return `<div class="todo${done ? ' done' : ''}" data-key="${esc(key)}"><button class="box" type="button" aria-pressed="${done}" aria-label="Toggle">${done ? '✓' : ''}</button><span class="b txt" id="${id}">${richHTML(b.rich)}</span></div>${kids}`;
        }
        case 'callout': { const id = register(b, 0); return `<div class="callout ${color}"><div class="c-icon">${esc(b.icon || '💡')}</div><div class="c-body"><span class="b" id="${id}" style="padding:0">${richHTML(b.rich)}</span>${kids}</div></div>`; }
        case 'quote': { const id = register(b, 0); return `<blockquote class="b ${color}" id="${id}">${richHTML(b.rich)}${kids}</blockquote>`; }
        case 'divider': return '<hr class="div">';
        case 'code': { const id = register(b, 0); return `<pre class="code" id="${id}"><span class="lang">${esc(b.language || '')}</span>${esc(plain(b.rich))}</pre>`; }
        case 'image': { const u = safeUrl(b.url); return u ? `<figure class="img"><img src="${esc(u)}" alt="${esc(plain(b.rich))}" loading="lazy">${b.rich?.length ? `<figcaption>${richHTML(b.rich)}</figcaption>` : ''}</figure>` : ''; }
        case 'bookmark': { const u = safeUrl(b.url); return u ? `<a class="bookmark" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${richHTML(b.rich) || esc(new URL(u).hostname)}<small>${esc(u)}</small></a>` : ''; }
        case 'child_page': { register(b, 0); return `<div class="page-link">📄 ${richHTML(b.rich)}</div>`; }
        case 'table': return `<table class="tbl"><tbody>${(b.children || []).map((row, r) => `<tr class="${r === 0 && b.hasHeader ? 'head' : ''}">${(row.cells || []).map(c => `<td>${richHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        case 'column_list': case 'column': case 'synced_block': return kids;
        default: return `<p class="b unsupported">${richHTML(b.rich)}</p>`;
      }
    }

    function render() {
      index = []; seq = 0;
      document.title = `${doc.title} · Helios`;
      $('crumb-title').textContent = doc.title;
      $('title').textContent = doc.title;
      $('page-icon').textContent = doc.icon || '';
      $('page-icon').hidden = !doc.icon;
      const cover = doc.cover && safeUrl(doc.cover);
      $('cover').style.backgroundImage = cover ? `url("${cover.replace(/"/g, '%22')}")` : '';

      const props = Object.entries(doc.properties || {});
      if (doc.lastEdited) props.push(['Last edited', new Date(doc.lastEdited).toLocaleString()]);
      props.push(['Source', doc.source === 'notion' ? 'Notion (live)' : 'Helios catalog (preview)']);
      $('props').innerHTML = props.map(([k, v]) => `<div class="prop"><div class="prop-name">≡ ${esc(k)}</div><div class="prop-value">${k === 'Status' ? `<span class="tag">${esc(v)}</span>` : esc(v)}</div></div>`).join('');

      $('blocks').innerHTML = renderBlocks(doc.blocks || []);
      $('outline').innerHTML = index.filter(x => x.level).map(x => `<button type="button" class="lvl-${x.level}" data-target="${x.id}">${esc(x.text)}</button>`).join('') || '<div class="side-foot" style="border:0">No headings</div>';
      wire();
      if (location.hash) jump(location.hash.slice(1), false);
    }

    function status() {
      const live = doc.source === 'notion';
      const badge = $('badge');
      badge.className = 'badge ' + (live ? 'live' : 'preview');
      badge.textContent = live ? '● Live from Notion' : 'Preview';
      $('synced').textContent = live ? 'Synced ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
      const open = $('open-notion'), url = meta.url && safeUrl(meta.url);
      open.hidden = !url; if (url) open.href = url;
      const warn = meta.warning, setup = !meta.configured && meta.configured !== undefined;
      $('banner').innerHTML = warn
        ? `<div class="banner">⚠️ <div>${esc(warn)}</div></div>`
        : setup ? `<div class="banner">🔌 <div>Showing the Helios catalog as a Notion-style preview. To sync with a real Notion page, set <code>NOTION_TOKEN</code> and <code>NOTION_PARENT_PAGE_ID</code>, then run <code>bun run notion:publish</code>.</div></div>`
        : meta.offline ? `<div class="banner">📦 <div>Static snapshot. Open the live app to see the page synced from Notion.</div></div>` : '';
      $('side-foot').textContent = live ? 'Edits made in Notion show up here after a sync.' : 'Preview built from the live Helios catalog.';
    }

    // ---------- interactions ----------
    function wire() {
      $('outline').querySelectorAll('button[data-target]').forEach(b => b.onclick = () => { jump(b.dataset.target); if (innerWidth <= 900) document.body.classList.remove('sidebar-open'); });
      $('blocks').querySelectorAll('.todo .box').forEach(box => box.onclick = () => {
        const row = box.closest('.todo'), done = !row.classList.contains('done');
        row.classList.toggle('done', done); box.textContent = done ? '✓' : ''; box.setAttribute('aria-pressed', done);
        todoState[row.dataset.key] = done; store(todoKey, JSON.stringify(todoState));
      });
      const heads = index.filter(x => x.level).map(x => document.getElementById(x.id)).filter(Boolean);
      const io = new IntersectionObserver(entries => {
        for (const e of entries) if (e.isIntersecting) {
          $('outline').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.target === e.target.id));
        }
      }, {root: $('main'), rootMargin: '0px 0px -75% 0px'});
      heads.forEach(h => io.observe(h));
    }

    function jump(id, flash = true) {
      const el = document.getElementById(id); if (!el) return;
      for (let d = el.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      history.replaceState(null, '', '#' + id);
      if (flash) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 1600); }
    }

    let expanded = false;
    $('expand').onclick = () => {
      expanded = !expanded;
      document.querySelectorAll('details.toggle').forEach(d => d.open = expanded);
      $('expand').querySelector('.tb-label').textContent = expanded ? 'Collapse all' : 'Expand all';
    };
    $('copy-link').onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast('Link copied'); } catch { toast('Copy failed'); } };

    // ---------- search palette ----------
    let sel = 0, hits = [];
    const openPalette = () => { $('palette-back').classList.add('open'); $('palette-input').value = ''; search(''); $('palette-input').focus(); };
    const closePalette = () => $('palette-back').classList.remove('open');
    function search(q) {
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      hits = (terms.length ? index.filter(x => terms.every(t => x.text.toLowerCase().includes(t))) : index.filter(x => x.level)).slice(0, 40);
      sel = 0; drawHits(terms);
    }
    function drawHits(terms = []) {
      const mark = s => { let h = esc(s); for (const t of terms) h = h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); return h; };
      $('results').innerHTML = hits.length ? hits.map((h, i) => {
        const text = h.text.length > 110 ? h.text.slice(0, 110) + '…' : h.text;
        return `<button type="button" class="result${i === sel ? ' sel' : ''}" data-i="${i}">${h.level ? '# ' : ''}${mark(text)}<small>${esc(h.type.replace(/_/g, ' '))}</small></button>`;
      }).join('') : '<div class="result">No results</div>';
      $('results').querySelectorAll('.result[data-i]').forEach(b => b.onclick = () => { closePalette(); jump(hits[+b.dataset.i].id); });
      $('results').querySelector('.sel')?.scrollIntoView({block: 'nearest'});
    }
    $('palette-input').oninput = e => search(e.target.value);
    $('palette-input').onkeydown = e => {
      if (e.key === 'ArrowDown') { sel = Math.min(hits.length - 1, sel + 1); drawHits(e.target.value.toLowerCase().split(/\s+/).filter(Boolean)); e.preventDefault(); }
      if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); drawHits(e.target.value.toLowerCase().split(/\s+/).filter(Boolean)); e.preventDefault(); }
      if (e.key === 'Enter' && hits[sel]) { closePalette(); jump(hits[sel].id); }
    };
    $('palette-back').onclick = e => { if (e.target === $('palette-back')) closePalette(); };
    $('side-search').onclick = openPalette;
    addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
      if (e.key === 'Escape') closePalette();
    });

    // ---------- markdown export ----------
    function md(blocks, indent = '') {
      const inline = rich => (rich || []).map(r => { let t = r.text; if (r.code) t = '`' + t + '`'; if (r.bold) t = `**${t}**`; if (r.italic) t = `*${t}*`; if (r.strike) t = `~~${t}~~`; if (r.href) t = `[${t}](${r.href})`; return t; }).join('');
      let out = '', n = 0;
      for (const b of blocks) {
        n = b.type === 'numbered_list_item' ? n + 1 : 0;
        const kids = b.children?.length ? md(b.children, indent + '  ') : '';
        const t = inline(b.rich);
        switch (b.type) {
          case 'heading_1': out += `\n# ${t}\n\n${kids}`; break;
          case 'heading_2': out += `\n## ${t}\n\n${kids}`; break;
          case 'heading_3': out += `\n### ${t}\n\n${kids}`; break;
          case 'bulleted_list_item': out += `${indent}- ${t}\n${kids}`; break;
          case 'numbered_list_item': out += `${indent}${n}. ${t}\n${kids}`; break;
          case 'to_do': out += `${indent}- [${b.checked ? 'x' : ' '}] ${t}\n${kids}`; break;
          case 'toggle': out += `${indent}<details><summary>${t}</summary>\n\n${kids}\n${indent}</details>\n\n`; break;
          case 'callout': out += `${indent}> ${b.icon || ''} ${t}\n${kids ? kids.replace(/^/gm, indent + '> ') : ''}\n`; break;
          case 'quote': out += `${indent}> ${t}\n\n`; break;
          case 'divider': out += `\n---\n\n`; break;
          case 'code': out += '```' + (b.language || '') + '\n' + plain(b.rich) + '\n```\n\n'; break;
          default: out += t ? `${indent}${t}\n\n${kids}` : kids;
        }
      }
      return out;
    }
    $('side-md').onclick = () => {
      if (!doc) return;
      const text = `# ${doc.icon || ''} ${doc.title}\n\n` + Object.entries(doc.properties || {}).map(([k, v]) => `- **${k}:** ${v}`).join('\n') + '\n' + md(doc.blocks);
      const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([text], {type: 'text/markdown'})), download: 'helios-plan.md'});
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Markdown downloaded');
    };

    // ---------- data ----------
    async function load(fresh = false) {
      const refresh = $('side-refresh');
      refresh.innerHTML = '<span class="spin">🔄</span> Syncing…';
      try {
        let data;
        try {
          const r = await fetch('/api/notion/preview' + (fresh ? '?fresh=1' : ''), {headers: {accept: 'application/json'}});
          if (!r.ok) throw new Error(r.status);
          data = await r.json();
        } catch {
          // Static hosting (GitHub Pages) has no API: use the snapshot written at build time.
          const r = await fetch('./notion-preview.json');
          if (!r.ok) throw new Error('No preview available');
          data = {document: await r.json(), notion: {offline: true}};
        }
        doc = data.document; meta = data.notion || {};
        render(); status();
        if (fresh) toast(doc.source === 'notion' ? 'Synced from Notion' : 'Preview refreshed');
      } catch (error) {
        $('badge').className = 'badge preview'; $('badge').textContent = 'Offline';
        $('blocks').innerHTML = `<div class="callout bg-red"><div class="c-icon">⚠️</div><div class="c-body">Could not load the Helios plan. ${esc(error.message)}</div></div>`;
      } finally {
        refresh.innerHTML = '🔄 Sync from Notion';
      }
    }
    $('side-refresh').onclick = () => load(true);
    load();
  })();
  </script>
</body>
</html>
