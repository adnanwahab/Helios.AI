app = "helios-ai-laws"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  HELIOS_PGLITE_DIR = "/data/pglite"
  PUBLIC_ORIGINS = "https://helios-ai-laws.fly.dev"

[[mounts]]
  source = "helios_data"
  destination = "/data"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
