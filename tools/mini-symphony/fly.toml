app = "helios-mini-symphony"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "tools/mini-symphony/Dockerfile"

[processes]
  api = "bun tools/mini-symphony/pilot.mjs api"
  worker = "bun tools/mini-symphony/pilot.mjs worker"

[env]
  PORT = "8080"
  SYMPHONY_MODEL = "gpt-4.1-mini"
  SYMPHONY_ALLOWED_ORIGINS = "https://helioshtml.com,https://helios-ai-laws.fly.dev"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  processes = ["api", "worker"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
