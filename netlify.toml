[build]
  publish = "."

# Same-origin proxy: cookies and CSRF remain scoped to helioshtml.com.
[[redirects]]
  from = "/api/*"
  to = "https://helios-ai-laws.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/laws"
  to = "/helios_100_frontend_demo.html"
  status = 200

# Email signup iframe (the form posts to /api/email/subscribe, proxied above).
[[redirects]]
  from = "/signup"
  to = "/public/signup.html"
  status = 200
