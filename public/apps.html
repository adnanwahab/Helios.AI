<!doctype html>
<!--
  /apps: HappyBearLandia, Civic Synthesis, Digital Pensieve and Helios side by side,
  each live in its own iframe. To add, remove or reorder apps, edit APPS in the script.
  Keys: 1-4 show one app full size, 0 or Esc goes back to all of them.
  Links: /apps#helios (or any app id) opens straight to that app.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adnan's apps</title>
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#e8eaee,#0b0c0f);
  --panel:light-dark(#ffffff,#15171c);
  --bar:light-dark(#f7f8fa,#1b1e24);
  --ink:light-dark(#15171b,#eceef2);
  --muted:light-dark(#596170,#9aa2af);
  --line:light-dark(#d2d6dd,#2a2e36);
  --hover:light-dark(#e6e9ee,#262a32);
  --ring:light-dark(#1d5bff,#8bb0ff);
  --gap:10px;
  --top:52px;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{flex:none;display:flex;align-items:center;gap:14px;height:var(--top);padding:0 var(--gap) 0 16px}
h1{flex:none;margin:0;font-size:15px;font-weight:650;white-space:nowrap}
nav{display:flex;gap:6px;margin-left:auto;padding:4px 2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
main{flex:1;min-height:0;display:grid;gap:var(--gap);padding:0 var(--gap) var(--gap);grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--rows,2),minmax(0,1fr))}
main.solo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
main.solo .app:not(.on){display:none}
.app{container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.bar{flex:none;display:flex;align-items:center;gap:9px;height:38px;padding:0 5px 0 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.name{flex:0 1 auto;overflow:hidden;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.host{flex:1 1 0;overflow:hidden;color:var(--muted);font-size:12.5px;white-space:nowrap;text-overflow:ellipsis}
.tools{flex:none;display:flex;gap:2px;margin-left:auto}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 9px;border:0;border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:12.5px;text-decoration:none;white-space:nowrap;cursor:pointer}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool svg{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.view{position:relative;flex:1}
.wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;transition:opacity .3s}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .3s}
.ready iframe{opacity:1}
.ready .wait{opacity:0}
/* Narrow panels (phones, two columns on small laptops): icon-only buttons, no host name. */
@container (max-width:439px){.tool .lbl{display:none}}
@container (max-width:419px){.host{display:none}}
@media (max-width:760px){
  html,body{height:auto}
  body{display:block}
  header{position:sticky;top:0;z-index:1;background:var(--bg)}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:76svh}
  main.solo{grid-template-rows:none;grid-auto-rows:calc(100svh - var(--top) - var(--gap))}
}
@media (pointer:coarse){.chip{height:40px}.tool{height:40px;min-width:40px;padding:0 12px}}
@media (prefers-reduced-motion:reduce){iframe,.wait{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Adnan's apps</h1>
  <nav id="nav" aria-label="Choose what to show"></nav>
</header>
<main id="grid"></main>
<script>
{
  // url is what loads in the frame; open (optional) is where the Open button goes.
  // Civic Synthesis only allows other sites to frame its /embed page: every other
  // route sends frame-ancestors 'self' (FRAME_ANCESTORS in its fly.toml covers /embed only).
  const APPS = [
    {id: 'happybearlandia',  name: 'HappyBearLandia',  url: 'https://happybearlandia.fly.dev/',  color: '#2fb176'},
    {id: 'civic-synthesis',  name: 'Civic Synthesis',  url: 'https://civic-synthesis.fly.dev/embed', open: 'https://civic-synthesis.fly.dev/', color: '#4b8bff'},
    {id: 'digital-pensieve', name: 'Digital Pensieve', url: 'https://digital-pensieve.fly.dev/', color: '#a07aff'},
    {id: 'helios',           name: 'Helios.AI',        url: 'https://helios-ai-laws.fly.dev/',   color: '#f0b000'},
  ];
  // What the framed apps may use: fullscreen, gamepads, WebXR, sound, copy and share.
  const ALLOW = 'fullscreen; autoplay; clipboard-write; gamepad; xr-spatial-tracking; web-share';
  const REVEAL_AFTER_MS = 6000; // show a frame even if its page is still loading

  const nav = document.getElementById('nav');
  const grid = document.getElementById('grid');
  grid.style.setProperty('--rows', Math.ceil(APPS.length / 2));

  const make = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };
  const dot = color => {
    const d = make('span', 'dot');
    d.style.setProperty('--c', color);
    return d;
  };
  const button = (cls, text, onClick) => {
    const b = make('button', cls, text);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  };
  // Panel buttons: icon plus label; phones show the icon only.
  const ICONS = {
    reload: '<path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2.4v3.2h-3.2"/>',
    expand: '<path d="M9.5 2.5h4v4M13.5 2.5 9.2 6.8M6.5 13.5h-4v-4M2.5 13.5l4.3-4.3"/>',
    grid: '<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
    open: '<path d="M9.5 2.5h4v4M13.5 2.5 8 8M12 9.5V12a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 3 12V5.5A1.5 1.5 0 0 1 4.5 4H7"/>',
  };
  const setTool = (el, icon, label, longLabel) => {
    el.innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true">${ICONS[icon]}</svg><span class="lbl"></span>`;
    el.lastChild.textContent = label;
    el.setAttribute('aria-label', longLabel);
    el.title = longLabel;
  };

  const allChip = button('chip', 'All', () => show(''));
  nav.append(allChip);

  const panels = APPS.map((app, i) => {
    const host = new URL(app.url).host;

    const chip = button('chip', '', () => show(app.id));
    chip.title = `Show only ${app.name} (key ${i + 1})`;
    chip.append(dot(app.color), app.name);
    nav.append(chip);

    const frame = make('iframe');
    frame.title = app.name;
    frame.setAttribute('allow', ALLOW);
    frame.allowFullscreen = true;

    const view = make('div', 'view');
    view.append(make('div', 'wait', `Loading ${host}…`), frame);
    let timer = 0;
    const ready = () => { clearTimeout(timer); view.classList.add('ready'); };
    const load = () => {
      view.classList.remove('ready');
      clearTimeout(timer);
      timer = setTimeout(ready, REVEAL_AFTER_MS);
      frame.src = app.url;
    };
    frame.addEventListener('load', ready);

    const reload = button('tool', '', load);
    setTool(reload, 'reload', 'Reload', `Reload ${app.name} from its home page`);

    const size = button('tool', '', () => show(current() === app.id ? '' : app.id));

    const open = make('a', 'tool');
    setTool(open, 'open', 'Open', `Open ${host} in a new tab`);
    open.href = app.open || app.url;
    open.target = '_blank';
    open.rel = 'noopener';

    const tools = make('div', 'tools');
    tools.append(reload, size, open);
    const bar = make('div', 'bar');
    bar.append(dot(app.color), make('span', 'name', app.name), make('span', 'host', host), tools);

    const panel = make('section', 'app');
    panel.setAttribute('aria-label', app.name);
    panel.append(bar, view);
    grid.append(panel);
    load();
    return {app, chip, size, panel};
  });

  function current() {
    let id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch {}
    return panels.some(p => p.app.id === id) ? id : '';
  }

  function render() {
    const id = current();
    grid.classList.toggle('solo', Boolean(id));
    allChip.setAttribute('aria-pressed', String(!id));
    for (const p of panels) {
      const on = p.app.id === id;
      p.panel.classList.toggle('on', on);
      p.chip.setAttribute('aria-pressed', String(on));
      if (on) setTool(p.size, 'grid', 'Show all', 'Back to all apps (Esc)');
      else setTool(p.size, 'expand', 'Expand', `Show only ${p.app.name}`);
    }
  }

  function show(id) {
    if (id) {
      location.hash = id;
    } else if (location.hash) {
      try { history.pushState(null, '', location.href.split('#')[0]); }
      catch { location.hash = ''; }
    }
    render();
  }

  addEventListener('hashchange', render);
  addEventListener('popstate', render);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
    if (e.key === 'Escape' || e.key === '0') show('');
    const n = Number(e.key);
    if (Number.isInteger(n) && n >= 1 && n <= panels.length) show(panels[n - 1].app.id);
  });

  render();
}
</script>
</body>
</html>
