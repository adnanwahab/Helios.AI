<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Helios.AI — Merged Experiences</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121b2d;
      --line: #26344e;
      --text: #e7eef9;
      --muted: #9fb1cc;
      --active: #7ce4cf;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #101a2b, #0e1727);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: #07101d;
      background: var(--active);
      border-color: transparent;
    }

    .signup {
      flex: 0 0 340px;
      width: 340px;
      height: 44px;
      border: 0;
      background: transparent;
    }

    .views {
      position: relative;
      min-height: 0;
    }

    .view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #0b1220;
    }

    .view.active {
      display: block;
    }

    @media (max-width: 900px) {
      .topbar {
        height: auto;
        align-items: flex-start;
        flex-direction: column;
      }
      .tabs { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
      .tab { flex: 0 0 auto; }
      .signup { flex-basis: auto; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">Helios.AI · Merged index</div>
      <nav class="tabs" aria-label="Choose page">
        <button class="tab" id="tab-helios-ai" type="button" role="tab" aria-selected="true" aria-controls="view-helios-ai">HELIOS AI Landing Page</button>
        <button class="tab" id="tab-demo" type="button" role="tab" aria-selected="false" aria-controls="view-demo">100 Shared Goals</button>
        <button class="tab" id="tab-unified" type="button" role="tab" aria-selected="false" aria-controls="view-unified">Helios Unified</button>
        <button class="tab" id="tab-lab" type="button" role="tab" aria-selected="false" aria-controls="view-lab">Dynamicland (Local)</button>
        <button class="tab" id="tab-pensieve" type="button" role="tab" aria-selected="false" aria-controls="view-pensieve">Digital Pensieve</button>
        <button class="tab" id="tab-ycr" type="button" role="tab" aria-selected="false" aria-controls="view-ycr">YC Research</button>
      </nav>
      <iframe
        class="signup"
        title="Get one email from Helios"
        src="/signup?layout=inline"
      ></iframe>
    </header>

    <main class="views">
      <iframe
        id="view-helios-ai"
        class="view active"
        title="HELIOS AI Landing Page"
        src="/embed/helios-ai"
        loading="lazy"
      ></iframe>

      <iframe
        id="view-demo"
        class="view"
        title="100 Shared Goals"
        src="/embed/goals"
        loading="lazy"
      ></iframe>

      <iframe
        id="view-unified"
        class="view"
        title="Helios Unified"
        src="/embed/unified"
        loading="lazy"
      ></iframe>

      <iframe
        id="view-lab"
        class="view"
        title="Dynamicland Local"
        src="/embed/dynamicland"
        loading="lazy"
      ></iframe>

      <iframe
        id="view-pensieve"
        class="view"
        title="Digital Pensieve"
        src="https://digital-pensieve.fly.dev/"
        loading="lazy"
        allow="fullscreen; xr-spatial-tracking; autoplay"
        allowfullscreen
      ></iframe>

      <iframe
        id="view-ycr"
        class="view"
        title="YC Research"
        src="/proxy/ycr/"
        loading="lazy"
      ></iframe>
    </main>
  </div>

  <script>
    const tabs = {
      lab: document.getElementById('tab-lab'),
      heliosAi: document.getElementById('tab-helios-ai'),
      demo: document.getElementById('tab-demo'),
      unified: document.getElementById('tab-unified'),
      pensieve: document.getElementById('tab-pensieve'),
      ycr: document.getElementById('tab-ycr')
    };

    const views = {
      lab: document.getElementById('view-lab'),
      heliosAi: document.getElementById('view-helios-ai'),
      demo: document.getElementById('view-demo'),
      unified: document.getElementById('view-unified'),
      pensieve: document.getElementById('view-pensieve'),
      ycr: document.getElementById('view-ycr')
    };

    function activate(which) {
      for (const key of Object.keys(tabs)) {
        const isActive = key === which;
        tabs[key].setAttribute('aria-selected', String(isActive));
        views[key].classList.toggle('active', isActive);
      }
    }

    tabs.lab.addEventListener('click', () => activate('lab'));
    tabs.heliosAi.addEventListener('click', () => activate('heliosAi'));
    tabs.demo.addEventListener('click', () => activate('demo'));
    tabs.unified.addEventListener('click', () => activate('unified'));
    tabs.pensieve.addEventListener('click', () => activate('pensieve'));
    tabs.ycr.addEventListener('click', () => activate('ycr'));
  </script>
</body>
</html>
