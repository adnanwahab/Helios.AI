  <style>
    :root {
      --bg: #0b1220;
      --panel: #121b2d;
      --line: #26344e;
      --text: #e7eef9;
      --muted: #9fb1cc;
      --active: #7ce4cf;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #101a2b, #0e1727);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: normal;
      line-height: 1.3;
      flex-shrink: 0;
      max-width: 250px;
    }

    .welcome-start { color:#09221c; background:var(--active); border-radius:999px; padding:10px 15px; font-size:13px; font-weight:800; white-space:nowrap; text-decoration:none; }
    .welcome-start:focus-visible { outline:3px solid #ffdfa0; outline-offset:3px; }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: #07101d;
      background: var(--active);
      border-color: transparent;
    }

    .signup {
      flex: 0 0 340px;
      width: 340px;
      height: 44px;
      border: 0;
      background: transparent;
    }

    .views {
      position: relative;
      min-height: 0;
    }

    .view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #0b1220;
    }

    .view.active {
      display: block;
    }

    .byline {
      display: flex;
      justify-content: center;
      padding: 8px 14px 10px;
      border-top: 1px solid var(--line);
      background: #0e1727;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .byline a { text-decoration: none; display: inline-flex; }
    .byline { flex-wrap: wrap; gap: 12px 24px; }
    .byline .contact-link { color: var(--active); font-size: 14px; font-weight: 700; letter-spacing: 0; align-items: center; }
    .byline .contact-link:hover { text-decoration: underline; }
    .byline .contact-link:focus-visible { outline: 2px solid var(--active); outline-offset: 3px; border-radius: 4px; }

    .byline span {
      display: inline-block;
      white-space: pre;
      color: hsl(calc(var(--i) * 30deg) 100% 65%);
      text-shadow: 0 0 8px currentColor;
      animation: hue-cycle 3s linear infinite, bob 1.2s ease-in-out infinite;
      animation-delay: 0s, calc(var(--i) * 0.08s);
    }

    @keyframes hue-cycle {
      from { filter: hue-rotate(0deg); }
      to   { filter: hue-rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .byline span { animation: hue-cycle 3s linear infinite; }
    }

    @media (max-width: 900px) {
      .topbar {
        height: auto;
        align-items: flex-start;
        flex-direction: column;
      }
      .tabs { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
      .tab { flex: 0 0 auto; }
      .signup { flex-basis: auto; width: 100%; }
    }
  </style>

<body>

  <script>
    const tabs = {
      lab: document.getElementById('tab-lab'),
      morphlab: document.getElementById('tab-morphlab'),
      heliosAi: document.getElementById('tab-helios-ai'),
      hippie: document.getElementById('tab-hippie'),
      notion: document.getElementById('tab-notion'),
      worldPlan: document.getElementById('tab-world-plan'),
      radar: document.getElementById('tab-radar'),
      consensus: document.getElementById('tab-consensus'),
      merge: document.getElementById('tab-merge'),
      demo: document.getElementById('tab-demo'),
      orbit: document.getElementById('tab-orbit'),
      flags: document.getElementById('tab-flags'),
      unified: document.getElementById('tab-unified'),
      coil: document.getElementById('tab-coil'),
      pocket: document.getElementById('tab-pocket'),
      pensieve: document.getElementById('tab-pensieve'),
      braindance: document.getElementById('tab-braindance'),
      mail: document.getElementById('tab-mail'),
      ycr: document.getElementById('tab-ycr'),
      fork: document.getElementById('tab-fork'),
      rainbow: document.getElementById('tab-rainbow')
    };

    const views = {
      lab: document.getElementById('view-lab'),
      morphlab: document.getElementById('view-morphlab'),
      heliosAi: document.getElementById('view-helios-ai'),
      hippie: document.getElementById('view-hippie'),
      notion: document.getElementById('view-notion'),
      worldPlan: document.getElementById('view-world-plan'),
      radar: document.getElementById('view-radar'),
      consensus: document.getElementById('view-consensus'),
      merge: document.getElementById('view-merge'),
      demo: document.getElementById('view-demo'),
      orbit: document.getElementById('view-orbit'),
      flags: document.getElementById('view-flags'),
      unified: document.getElementById('view-unified'),
      coil: document.getElementById('view-coil'),
      pocket: document.getElementById('view-pocket'),
      pensieve: document.getElementById('view-pensieve'),
      braindance: document.getElementById('view-braindance'),
      mail: document.getElementById('view-mail'),
      ycr: document.getElementById('view-ycr'),
      fork: document.getElementById('view-fork'),
      rainbow: document.getElementById('view-rainbow')
    };

    function activate(which) {
      for (const key of Object.keys(tabs)) {
        const isActive = key === which;
        tabs[key].setAttribute('aria-selected', String(isActive));
        views[key].classList.toggle('active', isActive);
      }
    }

    tabs.lab.addEventListener('click', () => activate('lab'));
    tabs.morphlab.addEventListener('click', () => activate('morphlab'));
    tabs.heliosAi.addEventListener('click', () => activate('heliosAi'));
    tabs.hippie.addEventListener('click', () => activate('hippie'));
    tabs.notion.addEventListener('click', () => activate('notion'));
    tabs.worldPlan.addEventListener('click', () => activate('worldPlan'));
    tabs.radar.addEventListener('click', () => activate('radar'));
    tabs.consensus.addEventListener('click', () => activate('consensus'));
    tabs.merge.addEventListener('click', () => activate('merge'));
    tabs.demo.addEventListener('click', () => activate('demo'));
    tabs.orbit.addEventListener('click', () => activate('orbit'));
    tabs.flags.addEventListener('click', () => activate('flags'));
    tabs.unified.addEventListener('click', () => activate('unified'));
    tabs.coil.addEventListener('click', () => activate('coil'));
    tabs.pocket.addEventListener('click', () => activate('pocket'));
    tabs.pensieve.addEventListener('click', () => activate('pensieve'));
    tabs.braindance.addEventListener('click', () => activate('braindance'));
    tabs.mail.addEventListener('click', () => activate('mail'));
    tabs.ycr.addEventListener('click', () => activate('ycr'));
    tabs.fork.addEventListener('click', () => activate('fork'));
    tabs.rainbow.addEventListener('click', () => activate('rainbow'));
  </script>
