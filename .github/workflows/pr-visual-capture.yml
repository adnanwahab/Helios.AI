name: Helios PR Screenshot

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to capture or refresh (including older PRs)'
        required: true
        type: number

# PR code is intentionally executed only with read-only permissions.
permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual refresh uses trusted main to render the PR's deployed site.
          # Normal PR events build their merge commit with read-only permissions.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || '' }}
          persist-credentials: false
      - name: Resolve PR head for manual refresh
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: echo "MANUAL_PR_HEAD=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER --jq '.head.sha')" >> "$GITHUB_ENV"
      - name: Resolve deployed Netlify preview for manual refresh
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ env.MANUAL_PR_HEAD }}
        run: |
          PREVIEW="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/status" --jq '.statuses[] | select((.context | startswith("netlify/")) and (.context | endswith("/deploy-preview")) and .state == "success") | .target_url' | head -n 1)"
          if [ -z "$PREVIEW" ]; then
            echo "::error::PR #$PR_NUMBER does not have a successful Netlify deploy preview"
            exit 1
          fi
          echo "MANUAL_PREVIEW_URL=$PREVIEW" >> "$GITHUB_ENV"
      - name: Record PR identification
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || env.MANUAL_PR_HEAD }}
        run: |
          mkdir -p pr-visual-output
          printf '{"number":%s,"head_sha":"%s"}\n' "$PR_NUMBER" "$PR_HEAD_SHA" > pr-visual-output/manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check screenshot and publishing script syntax
        run: |
          node --check scripts/pr-visual-capture.mjs
          node --check scripts/pr-visual-publish.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Render Helios desktop and mobile screenshots
        env:
          PR_PREVIEW_URL: ${{ env.MANUAL_PREVIEW_URL }}
        run: node scripts/build-netlify.mjs && node scripts/pr-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helios-pr-visual-${{ github.run_id }}
          path: pr-visual-output/
          if-no-files-found: warn
          retention-days: 30
