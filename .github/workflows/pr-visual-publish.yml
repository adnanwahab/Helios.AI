name: Helios PR Preview Comment

on:
  workflow_run:
    workflows: [Helios PR Screenshot]
    types: [completed]

# Trusted workflow from default branch; never executes a PR or downloaded artifact.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download screenshot data from completed run
        uses: actions/download-artifact@v4
        with:
          name: helios-pr-visual-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr-visual-output
        continue-on-error: true
      - name: Update PR with screenshot and deploy preview URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-visual-publish.mjs
