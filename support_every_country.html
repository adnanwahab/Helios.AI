<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Every Country · Helios</title>
<link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600&display=swap">
<style>
/* VOICE occasion: a proud, steady parade of flags for a screen or a stream
   IDEA the big screen at an opening ceremony: one flag at a time, its name called beneath it
   PICTURE the flag itself, large, waving and lit, over a haze of its own colours
   COLOUR night stage #0b0d12, white ink, each flag's own colour for the rules beside the message
   TYPE Anton for the called name, Inter for the message, counter and controls
   LAYOUT flag centred, caption under it, counter top right, one control bar at the bottom; on a phone the name wraps to two lines and the bar stacks */
:root{color-scheme:dark;--bg:#0b0d12;--ink:#f5f6f8;--mute:#a9afbc;--panel:#141821;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#fallback{position:fixed;display:none;object-fit:contain}
#title{position:fixed;top:14px;left:max(16px,3vw);margin:0;font:600 clamp(15px,1.25vw,19px)/1.25 Inter,system-ui,sans-serif;letter-spacing:-.01em;transition:opacity .4s}
#count{position:fixed;top:14px;right:max(16px,3vw);text-align:right;font:600 clamp(15px,1.3vw,24px)/1.25 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--mute);pointer-events:none}
#count b{color:var(--ink);font-weight:600}
#count small{display:block;font-size:13px;font-weight:500}
#cap{position:fixed;text-align:center;pointer-events:none}
.kick{display:flex;align-items:center;justify-content:center;gap:.7em;font:600 var(--ks,40px)/1.1 Inter,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.kick span{margin-right:-.3em}
.kick i{flex:none;width:1.5em;height:max(2px,.07em);background:var(--acc,#fff);transition:background-color .4s}
.kick.empty i{visibility:hidden}
.names{display:grid;margin-top:var(--kg,20px)}
.name{grid-area:1/1;margin:0;font:400 var(--ns,140px)/1.04 Anton,Impact,"Arial Narrow Bold",sans-serif;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;overflow-wrap:normal;text-shadow:0 .03em .14em rgba(0,0,0,.5);opacity:0}
#bar{position:fixed;z-index:3;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1080px,calc(100% - 24px));display:flex;align-items:center;gap:6px;padding:6px;background:rgba(18,21,29,.92);border:1px solid var(--line);border-radius:14px;transition:opacity .4s}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:transparent;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.1)}
.ib:active{background:rgba(255,255,255,.18)}
.ib svg,.tb svg{width:22px;height:22px;fill:currentColor}
#play{background:#fff;color:#0b0d12}
#play:hover{background:#dfe2e9}
.tb{flex:none;height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.08)}
.tb[aria-expanded=true]{background:#fff;color:#0b0d12;border-color:#fff}
.tb svg{width:18px;height:18px}
:is(.ib,.tb,.chip,.tile,#msg,#q,#scrub):focus-visible{outline:2px solid #fff;outline-offset:2px}
#scrub{flex:1;height:44px;margin:0 8px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(#fff,#fff) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.24)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border:0;border-radius:50%;background:#fff}
#scrub::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.24)}
#scrub::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
#scrub::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
body.idle #bar,body.idle #title,body.clean #bar,body.clean #title{opacity:0;pointer-events:none}
body.idle,body.idle #gl{cursor:none}
.panel{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.panel h2{margin:0;font:600 19px/1.25 Inter,system-ui,sans-serif}
#custom{right:max(12px,calc(50% - 540px));bottom:calc(var(--barh,70px) + 12px);width:min(430px,calc(100% - 24px));max-height:calc(100% - var(--barh,70px) - 40px);overflow:auto;padding:18px}
.lab{display:block;margin:16px 0 8px;font-size:14px;font-weight:600;color:var(--mute)}
#msg{width:100%;height:46px;padding:0 12px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:#0c0f15;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#presets{margin-top:8px}
.chip{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.08)}
.chip[aria-pressed=true]{background:#fff;color:#0b0d12;border-color:#fff}
.chip em{margin-left:6px;font-style:normal;opacity:.6;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:18px 0 0;font-size:14px;color:var(--mute)}
.keys dt{color:var(--ink);font-weight:600}
.keys dd{margin:0}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#grid{inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);border:0;border-radius:0;background:var(--bg)}
#grid header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px max(16px,3vw)}
#grid h2{flex:1 1 auto}
#grid h2 span{color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
#q{flex:1 1 240px;max-width:440px;height:46px;padding:0 14px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:#0c0f15;font-size:16px}
.gbody{overflow:auto;overscroll-behavior:contain;padding:4px max(16px,3vw) 28px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;font-weight:500;line-height:1.25;text-align:center;cursor:pointer}
.tile:hover{background:rgba(255,255,255,.1)}
.tile[aria-current=true]{border-color:#fff}
.tile i{display:block;width:100%;aspect-ratio:200/128;background:url(/public/flags/thumbs.webp) 0 0/1500% 1300% no-repeat}
.tile span{min-height:2.5em}
#empty{color:var(--mute)}
#toast{position:fixed;z-index:9;top:60px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:#fff;color:#0b0d12;font-size:15px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){
#bar{flex-wrap:wrap;justify-content:space-between;row-gap:0}
#scrub{order:-1;flex:1 0 100%;margin:0 8px}
.tb{padding:0 12px}
.tb .t{display:none}
#custom{left:12px;right:12px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<canvas id="gl" role="img" aria-label="Waving flag"></canvas>
<img id="fallback" alt="">
<h1 id="title">Support every country</h1>
<div id="count"><b id="cn">001</b> / <span id="ct">195</span><small id="creg"></small></div>
<div id="cap">

</div>
<p class="sr" id="live" aria-live="polite"></p>

<div id="bar" role="toolbar" aria-label="Playback">

  <button class="ib" id="play" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><path id="pp" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
  <button class="ib" id="next" type="button" aria-label="Next flag"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button>
  <input type="range" id="scrub" min="0" max="194" value="0" aria-label="Choose a flag">
  <button class="tb" id="gridBtn" type="button" aria-expanded="false" aria-controls="grid" aria-label="All flags"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span class="t">All flags</span></button>
  <button class="tb" id="customBtn" type="button" aria-expanded="false" aria-controls="custom" aria-label="Customize"><svg viewBox="0 0 24 24"><path d="M3 6h11v2H3zM18 6h3v2h-3zM14 4h4v6h-4zM3 16h3v2H3zM10 16h11v2H10zM6 14h4v6H6z"/></svg><span class="t">Customize</span></button>
  <button class="ib" id="hideBtn" type="button" aria-label="Hide controls"><svg viewBox="0 0 24 24"><path d="M12 6c-4.6 0-8.3 3.2-9.8 6 1.5 2.8 5.2 6 9.8 6s8.3-3.2 9.8-6c-1.5-2.8-5.2-6-9.8-6zm0 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/><path d="M3.4 2 22 20.6 20.6 22 2 3.4z"/></svg></button>
  <button class="ib" id="fsBtn" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
</div>

<section class="panel" id="custom" hidden aria-label="Customize">
  <h2>Customize</h2>
  <label class="lab" for="msg">Message above each name</label>
  <input id="msg" maxlength="28" autocomplete="off" spellcheck="false">
  <div class="chips" id="presets"><button type="button" class="chip">Support</button><button type="button" class="chip">Stand with</button><button type="button" class="chip">I love</button><button type="button" class="chip">Pray for</button><button type="button" class="chip">Welcome</button></div>
  <span class="lab">Seconds per flag</span>
  <div class="chips" id="speed"></div>
  <span class="lab">Countries</span>
  <div class="chips" id="region"></div>
  <span class="lab">Order</span>
  <div class="chips" id="order"></div>
  <dl class="keys"><dt>Space</dt><dd>Play or pause</dd><dt>&larr; &rarr;</dt><dd>Previous or next flag</dd><dt>G</dt><dd>All flags</dd><dt>H</dt><dd>Hide controls</dd><dt>F</dt><dd>Full screen</dd></dl>
  <div class="row"><button class="tb" id="reset" type="button">Reset</button><button class="tb" id="done" type="button">Done</button></div>
</section>

<section class="panel" id="grid" hidden aria-label="All flags">
  <header><h2>All flags <span id="gcount">195</span></h2><input id="q" type="search" placeholder="Search countries" autocomplete="off" aria-label="Search countries"><button class="tb" id="closeGrid" type="button">Close</button></header>
  <div class="gbody"><div id="tiles"></div><p id="empty" hidden></p></div>
</section>
<div id="toast" role="status"></div>

  if (st.order === "shuffle") {
    let s = Date.now() % 2147483646 + 1;
    for (let k = l.length - 1; k > 0; k--) { s = s * 16807 % 2147483647; const j = s % (k + 1); [l[k], l[j]] = [l[j], l[k]]; }
  }
  list = l;
  const p = list.indexOf(keep);
  pos = p < 0 ? 0 : p;
  updCount();
  return p >= 0;
}
function setHash() {
  if (playing || !list.length) return;
  try { history.replaceState(null, "", "#" + slug(C[list[pos]][1])); } catch (e) {}
}
function fromHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)).toLowerCase(); } catch (e) {}
  return h ? C.findIndex(c => slug(c[1]) === h || c[0] === h) : -1;
}
function markTile() { for (const b of tiles.children) b.setAttribute("aria-current", String(+b.dataset.i === list[pos])); }
function afterNav() { if (!playing) setHash(); if (built) markTile(); }
async function show(p, dir = 1, instant = false) {
  if (!list.length) return;
  pos = ((p % list.length) + list.length) % list.length;
  const i = list[pos], my = ++tok;
  updCount();
  busy = true;
  if (!gl) {
    cur = {i}; fb.src = ASSETS + C[i][0] + ".webp"; fb.alt = `Flag of ${C[i][1]}`;
    placeFallback(); setCaption(i, true); lastT = now(); busy = false; afterNav();
    return;
  }
  let f;
  try { f = await getFlag(i); } catch (e) {
    if (my === tok) { busy = false; lastT = now(); toast(`Couldn't load the flag of ${C[i][1]}.`); }
    return;
  }
  if (my !== tok) return;
  busy = false;
  for (const d of [1, -1, 2]) getFlag(list[(pos + d + list.length) % list.length]).catch(() => {});
  if (trans) { cur = trans.to; trans = null; }
  lastT = now();
  if (f === cur) { afterNav(); return; }
  const quick = instant || !cur, dur = Math.min(.4, st.sec * .4);
  setCaption(i, quick, dur);
  if (quick) cur = f; else trans = {from: cur, to: f, t0: lastT, dur, dir};
  afterNav();
}
function go(d) { return show(pos + d, d); }
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (playing && grid.hidden && custom.hidden) document.body.classList.add("idle"); }, 2600);
}
function setPlaying(v) {
  playing = v;
  $("#pp").setAttribute("d", v ? PAUSE : PLAY);
  $("#play").setAttribute("aria-label", v ? "Pause" : "Play");
  lastT = now(); wake();
  if (!v && list.length) { setHash(); $("#live").textContent = `${st.msg} ${C[list[pos]][1]}`; }
}
function setClean(v) {
  document.body.classList.toggle("clean", v);
  if (v) toast("Controls hidden. Press H or tap the screen to bring them back.");
}
async function toggleFs() {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
  catch (e) { toast("Full screen isn't available in this view."); }
}

// ---------- settings ----------
function chips(el, items, curV, label) {
  el.innerHTML = items.map(v => `<button type="button" class="chip" data-v="${v}" aria-pressed="${String(v) === String(curV)}">${label(v)}</button>`).join("");
}
function renderChips() {
  chips($("#speed"), SPEEDS, st.sec, v => `${v} s`);
  chips($("#region"), REGIONS, st.region, v => `${v}<em>${v === "All" ? C.length : CNT[v]}</em>`);
  chips($("#order"), ["az", "shuffle"], st.order, v => v === "az" ? "A to Z" : "Shuffle");
}
function applyMsg() {
  st.msg = msgIn.value.slice(0, 28);
  $("#kick").textContent = st.msg.trim() || " ";
  kick.classList.toggle("empty", !st.msg.trim());
  save();
}
function setRegion(r, keep) {
  st.region = r; save(); renderChips();
  if (!buildList(keep)) show(0, 1);
}
function openCustom() { closeGrid(false); custom.hidden = false; $("#customBtn").setAttribute("aria-expanded", "true"); wake(); }
function closeCustom() { custom.hidden = true; $("#customBtn").setAttribute("aria-expanded", "false"); }

// ---------- all flags ----------
function buildTiles() {
  tiles.innerHTML = C.map((c, i) => `<button type="button" class="tile" data-i="${i}"><i style="background-position:${(i % 15) / 14 * 100}% ${Math.floor(i / 15) / 12 * 100}%"></i><span>${disp(c[1]).replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span></button>`).join("");
  built = true;
}
function filterTiles() {
  const s = norm(q.value.trim());
  let n = 0;
  for (const b of tiles.children) {
    const c = C[+b.dataset.i], ok = !s || norm(c[1]).includes(s) || (ALIAS[c[0]] || "").includes(s);
    b.hidden = !ok; if (ok) n++;
  }
  const em = $("#empty");
  em.hidden = n > 0; em.textContent = n ? "" : `No country matches “${q.value.trim()}”.`;
  $("#gcount").textContent = s ? `${n} of ${C.length}` : String(C.length);
}
function openGrid(focus) {
  closeCustom();
  if (!built) buildTiles();
  q.value = ""; filterTiles(); markTile();
  grid.hidden = false; $("#gridBtn").setAttribute("aria-expanded", "true");
  const b = tiles.querySelector('[aria-current="true"]');
  if (b) b.scrollIntoView({block: "center"});
  if (focus) q.focus({preventScroll: true});
  wake();
}
function closeGrid(restore = true) {
  if (grid.hidden) return;
  grid.hidden = true; $("#gridBtn").setAttribute("aria-expanded", "false");
  if (restore) $("#gridBtn").focus({preventScroll: true});
}
function pick(i) {
  if (!list.includes(i)) { st.region = "All"; save(); renderChips(); buildList(list[pos]); }
  const p = list.indexOf(i);
  setPlaying(false);
  show(p, p >= pos ? 1 : -1);
}

// ---------- events ----------
$("#play").addEventListener("click", () => setPlaying(!playing));
$("#next").addEventListener("click", () => go(1));
$("#prev").addEventListener("click", () => go(-1));
$("#gridBtn").addEventListener("click", () => { if (grid.hidden) openGrid(false); else closeGrid(); });
$("#customBtn").addEventListener("click", () => { if (custom.hidden) openCustom(); else closeCustom(); });
$("#done").addEventListener("click", closeCustom);
$("#closeGrid").addEventListener("click", () => closeGrid());
$("#hideBtn").addEventListener("click", () => setClean(true));
$("#fsBtn").addEventListener("click", toggleFs);
$("#fsBtn").hidden = !(document.fullscreenEnabled && document.documentElement.requestFullscreen);
scrub.addEventListener("input", () => { const v = +scrub.value; if (v !== pos) show(v, v > pos ? 1 : -1, true); });
msgIn.addEventListener("input", applyMsg);
$("#presets").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { msgIn.value = b.textContent; applyMsg(); } });
$("#speed").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { st.sec = +b.dataset.v; save(); renderChips(); } });
$("#region").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setRegion(b.dataset.v, list[pos]); });
$("#order").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { st.order = b.dataset.v; save(); renderChips(); buildList(list[pos]); } });
$("#reset").addEventListener("click", () => { Object.assign(st, DEF); msgIn.value = st.msg; applyMsg(); renderChips(); buildList(list[pos]); toast("Settings reset."); });
tiles.addEventListener("click", e => { const b = e.target.closest(".tile"); if (b) { closeGrid(); pick(+b.dataset.i); } });
q.addEventListener("input", filterTiles);
q.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const b = tiles.querySelector(".tile:not([hidden])"); if (b) b.click(); } });
cv.addEventListener("pointerdown", e => { down = {x: e.clientX, y: e.clientY, idle: document.body.classList.contains("idle"), panel: !custom.hidden}; });
cv.addEventListener("pointercancel", () => { down = null; });
cv.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down, dx = e.clientX - d.x, dy = e.clientY - d.y;
  down = null;
  if (d.panel) { closeCustom(); return; }
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) { go(dx < 0 ? 1 : -1); return; }
  if (Math.hypot(dx, dy) > 12) return;
  if (document.body.classList.contains("clean")) setClean(false);
  else if (!d.idle) setPlaying(!playing);
});
cv.addEventListener("webglcontextlost", e => e.preventDefault());
cv.addEventListener("webglcontextrestored", () => location.reload());
document.addEventListener("pointerdown", e => { if (!custom.hidden && !custom.contains(e.target) && !$("#customBtn").contains(e.target) && e.target !== cv) closeCustom(); });
for (const ev of ["pointermove", "pointerdown", "keydown"]) addEventListener(ev, wake, {passive: true});
addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!grid.hidden) closeGrid(); else if (!custom.hidden) closeCustom(); else if (document.body.classList.contains("clean")) setClean(false);
    return;
  }
  const t = e.target, range = t === scrub;
  if ((t.tagName === "INPUT" && !range) || e.metaKey || e.ctrlKey || e.altKey || !grid.hidden) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === " ") { if (t.tagName !== "BUTTON") { e.preventDefault(); setPlaying(!playing); } }
  else if ((k === "ArrowRight" || k === "ArrowLeft") && !range) { e.preventDefault(); go(k === "ArrowRight" ? 1 : -1); }
  else if (k === "Home" && !range) { e.preventDefault(); show(0, -1); }
  else if (k === "End" && !range) { e.preventDefault(); show(list.length - 1, 1); }
  else if (k === "g" || k === "/") { e.preventDefault(); openGrid(true); }
  else if (k === "c") { if (custom.hidden) openCustom(); else closeCustom(); }
  else if (k === "h") setClean(!document.body.classList.contains("clean"));
  else if (k === "f" && !$("#fsBtn").hidden) toggleFs();
});
addEventListener("hashchange", () => { const i = fromHash(); if (i >= 0 && i !== list[pos]) pick(i); });
addEventListener("resize", layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

// ---------- start ----------
function start(saved) {
  saved = saved || {};
  Object.assign(st, loadSaved(), saved.st || {});
  sanitize();
  msgIn.value = st.msg; applyMsg(); renderChips();
  let first = typeof saved.idx === "number" ? saved.idx : 0;
  const h = fromHash();
  if (h >= 0) first = h;
  if (h >= 0 || saved.playing === false) playing = false;
  if (!buildList(first) && h >= 0) { st.region = "All"; renderChips(); buildList(first); }
  setPlaying(playing);
  layout();
  show(pos, 1, true);
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({st: {...st}, idx: list[pos], playing}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
}
</script>
</body>
