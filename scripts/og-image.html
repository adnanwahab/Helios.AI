<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b1220;color:#e7eef9;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;
    background:radial-gradient(900px 500px at 100% 0%,rgba(232,116,59,.28),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(124,228,207,.16),transparent 60%),#0b1220}
  .eyebrow{font-size:22px;font-weight:800;letter-spacing:.18em;color:#e8743b}
  h1{margin:14px 0 40px;font-size:68px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  .row{display:flex;align-items:center;gap:26px}
  .card{flex:1;border:1px solid #26344e;border-radius:22px;background:#121b2d;padding:26px 30px;min-height:150px;box-sizing:border-box}
  .label{font-size:17px;font-weight:700;letter-spacing:.1em;color:#9fb1cc;margin-bottom:12px}
  .wish{font-size:31px;line-height:1.25;font-style:italic}
  .law{font-size:31px;line-height:1.2;font-weight:800;color:#7ce4cf}
  .arrow{font-size:54px;color:#e8743b;font-weight:800}
  .foot{position:absolute;left:72px;right:72px;bottom:52px;display:flex;justify-content:space-between;font-size:24px;color:#9fb1cc}
  .vote b{color:#e7eef9}
</style></head>
<body><div class="wrap">
  <div class="eyebrow">HELIOS.AI</div>
  <h1>Write a wish in your journal.<br>Helios turns it into a law.</h1>
  <div class="row">
    <div class="card"><div class="label">YOUR JOURNAL</div><div class="wish">“Please build a bridge from New York to France.”</div></div>
    <div class="arrow">→</div>
    <div class="card"><div class="label">HELIOS PROPOSES</div><div class="law">Transatlantic Connection Initiative</div></div>
  </div>
  <div class="foot"><span>helioshtml.com</span><span class="vote">Vote <b>yes</b>, <b>no</b>, or <b>edit</b></span></div>
</div></body></html>
