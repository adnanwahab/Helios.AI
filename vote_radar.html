<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>Vote Radar</title>
<meta name="description" content="A radar-style map of simulated daily votes across US states, with the needs, consensus and dissent that surface each day. Sample data, not an official ballot.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: night-shift operations HUD, calm and exact; the votes are the only bright thing.
   IDEA: an air-traffic radar scope, but each blip is the latest vote from a place.
   PICTURE: dot-matrix US inside a 24-hour dial; the sweep is the clock hand and lights votes as it passes.
   COLOUR and TYPE: black ground, white for yea, one orange for nay and dissent; Geist with Geist Mono labels.
   LAYOUT: days across the top, scope centred, live feed and callouts at right, four running figures along the bottom. */
html,body{margin:0;background:#050505}
[hidden]{display:none!important}
.vr{--accent:#ff8a3d;position:relative;box-sizing:border-box;height:100vh;min-height:680px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;row-gap:6px;padding:16px 28px 18px;background:#050505;color:#ececec;font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.vr *,.vr *::before,.vr *::after{box-sizing:border-box;min-width:0}
:where(.vr) button{font:inherit;color:inherit}
.nw{white-space:nowrap}
.vr :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;column-gap:20px}
.brand{display:flex;align-items:center;gap:10px;height:44px;font-size:15px;letter-spacing:-.01em;color:#f3f3f3;white-space:nowrap}
.brand b{font-weight:600}
.brand em{font-style:normal;color:#a9a9a9}
.logo{flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs{display:flex;gap:4px}
.tab{appearance:none;background:none;border:0;margin:0;padding:14px 7px 8px;min-height:44px;min-width:62px;display:flex;flex-direction:column;align-items:stretch;gap:8px;cursor:pointer;color:#8d8d8d;font:500 11px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-align:left;white-space:nowrap;transition:color .2s}
.tab:hover{color:#d4d4d4}
.tab[aria-current="true"]{color:#fff}
.track{position:relative;display:block;height:1px;background:#2f2f2f}
.fill{position:absolute;left:0;top:0;height:1px;background:#e8e8e8}
.mk{position:absolute;top:-6px;width:3px;height:3px;background:#555;transform:translateX(-50%)}
.mk.on{background:#f2f2f2}
.ballot{margin:0;max-width:660px;text-align:center;font:400 11px/1.5 "Geist Mono",ui-monospace,monospace;letter-spacing:.06em;color:#8f8f8f;text-wrap:balance}
.ballot b{font:500 13px/1.5 Geist,system-ui,sans-serif;letter-spacing:0;color:#f1f1f1}
.ctrl{justify-self:end;display:flex;align-items:center}
.pillbtn{appearance:none;background:none;border:0;padding:0;height:44px;display:flex;align-items:center;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px 0 11px;border:1px solid #2d2d2d;border-radius:15px;background:#0c0c0c;color:#d6d6d6;font:500 10.5px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;transition:border-color .2s}
.pillbtn:hover .pill{border-color:#575757}
.pill svg{fill:#d6d6d6;stroke:#d6d6d6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.main{position:relative;min-height:0}
.stage{position:absolute;inset:0}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hub{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer}
.tp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none}
.time{padding:7px 12px;border:1px solid #2c2c2c;border-radius:15px;background:rgba(9,9,9,.9);font:500 11px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.04em;color:#ececec;white-space:nowrap}
.leg{display:flex;gap:14px;font:500 10px/1 "Geist Mono",ui-monospace,monospace;letter-spacing:.12em;color:#a6a6a6;white-space:nowrap}
.leg i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.leg .yea{background:#ededed}
.leg .nay{background:var(--accent)}
.feed{position:absolute;right:0;top:3%;bottom:3%;width:clamp(232px,19vw,286px);overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 24%,#000 80%,transparent 100%)}
.rows{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:5.2ch 3ch 8px minmax(0,1fr) auto;column-gap:9px;align-items:center;height:22px;font:400 11px/1 "Geist Mono",ui-monospace,monospace;color:#878787;white-space:nowrap}
.row .lab{color:#adadad;overflow:hidden;text-overflow:ellipsis}
.row .val{color:#e2e2e2;text-align:right;font-variant-numeric:tabular-nums}
.row.ev .lab,.row.ev .val{color:#fff}
.sq{display:block;width:7px;height:7px;background:#5e5e5e}
.sq.o{background:var(--accent)}
.sq.w{background:#f2f2f2}
.cardwrap{position:absolute;right:0;top:0;bottom:0;width:clamp(252px,21vw,304px);pointer-events:none}
.card{position:absolute;left:0;right:0;pointer-events:auto;background:rgba(11,11,11,.96);border:1px solid #2b2b2b;border-radius:8px;padding:14px 14px 12px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.ctag{display:flex;align-items:center;gap:8px;font:500 10.5px/1.2 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;color:#d2d2d2}
.ctitle{margin:11px 0 3px;font-size:18px;line-height:1.2;font-weight:500;letter-spacing:-.01em;color:#fff;text-wrap:balance}
.csrc{font:400 10.5px/1.3 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;color:#919191}
.cdesc{margin:10px 0 12px;font-size:13px;line-height:1.45;color:#bdbdbd}
.cspark{position:relative;height:46px;background:#121212;border-radius:3px;overflow:hidden}
.cspark svg{position:absolute;inset:0;width:100%;height:100%}
.cspark rect{fill:#1d1d1d}
.cspark path{fill:none;stroke:#ededed;stroke-width:1.25px;vector-effect:non-scaling-stroke}
.cspark path.o{stroke:var(--accent)}
.cdot{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
.cfoot{margin-top:10px;font:400 10.5px/1.3 "Geist Mono",ui-monospace,monospace;letter-spacing:.04em;color:#9c9c9c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.15fr) repeat(2,minmax(0,1fr));column-gap:clamp(16px,2.4vw,36px);align-items:end}
.kpi{display:flex;flex-direction:column}
.kpi.r{text-align:right}
.kl{font:500 10.5px/1.25 "Geist Mono",ui-monospace,monospace;letter-spacing:.1em;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{margin:6px 0 7px;font-size:clamp(22px,2vw,28px);font-weight:500;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;color:#f3f3f3}
.kv.o{color:var(--accent)}
.spark{position:relative;height:30px}
.spark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spark path{fill:none;stroke:#d0d0d0;stroke-width:1.25px;vector-effect:non-scaling-stroke}
.spark path.o{stroke:var(--accent)}
.spark path.dim{stroke:#4b4b4b}
.spark path.base{stroke:#2e2e2e}
.spark path.area{fill:rgba(255,255,255,.09);stroke:none}
.spark rect{fill:#ececec}
.dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 10px rgba(255,255,255,.6)}
.dot.o{background:var(--accent);box-shadow:0 0 0 3px rgba(255,138,61,.16),0 0 10px var(--accent)}
.note{margin:0;align-self:end;text-align:center;font:400 10.5px/1.5 "Geist Mono",ui-monospace,monospace;letter-spacing:.05em;color:#8a8a8a;padding-bottom:2px;text-wrap:balance}
@media (max-width:1180px){.feed{width:222px}.cardwrap{width:250px}}
@media (max-width:900px){
.vr{height:auto;min-height:100vh;overflow:visible;padding:10px 16px 24px;row-gap:12px}
.hdr{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
.mid{grid-column:1/-1;grid-row:2;align-items:stretch}
.tabs{overflow-x:auto;justify-content:flex-start;scrollbar-width:none;margin:0 -16px;padding:0 12px}
.tab{flex:none;min-width:56px}
.ballot{text-align:left}
.main{display:flex;flex-direction:column;gap:14px}
.stage{position:relative;inset:auto;width:100%;aspect-ratio:1/1}
.cardwrap{position:relative;inset:auto;width:auto;pointer-events:auto}
.card{position:relative;top:auto!important}
.feed{position:relative;inset:auto;width:auto;height:200px}
.ftr{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:22px}
.kpi.r{text-align:left}
.note{grid-column:1/-1;order:9;text-align:left}
}
</style>
</head>
<body>
<div class="vr" id="vr">
  <header class="hdr">
    <div class="brand">
      <svg class="logo" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.4l3 3 6-6.4"></path></svg>
      <span><b>Civic Synthesis</b> <em>Radar</em></span>
    </div>
    <div class="mid">
      <nav class="tabs" id="days" aria-label="Ballot days"></nav>
      <p class="ballot"><span id="ballotNo">BALLOT 03</span> · <b id="ballotQ">End twice-yearly clock changes</b></p>
    </div>
    <div class="ctrl">
      <button class="pillbtn" id="play" type="button" aria-label="Pause the radar">
        <span class="pill">
          <svg id="icoPause" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5v7M7 1.5v7"></path></svg>
          <svg id="icoPlay" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="display:none"><path d="M2.5 1.5l6 3.5-6 3.5z"></path></svg>
          <span id="playLabel">PAUSE</span>
        </span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="stage" id="stage">
      <canvas class="cv" id="cv" role="img" aria-label="Radar map of simulated daily votes across US states. Each dot is the latest vote from that area: white for yea, orange for nay."></canvas>
      <button class="hub" id="hub" type="button" tabindex="-1" aria-hidden="true"></button>
      <div class="tp" id="tp">
        <span class="time" id="time">Wed 12:00 ET</span>
        <span class="leg"><span><i class="yea"></i>YEA</span><span><i class="nay"></i>NAY</span></span>
      </div>
    </div>
    <div class="feed" id="feed" aria-hidden="true"><div class="rows" id="rows"></div></div>
    <div class="cardwrap" aria-live="polite">
      <article class="card" id="card" hidden>
        <div class="ctag"><span class="sq w" id="cSq"></span><span id="cTag"></span></div>
        <h2 class="ctitle" id="cTitle"></h2>
        <div class="csrc" id="cSrc"></div>
        <p class="cdesc" id="cDesc"></p>
        <div class="cspark"><svg viewBox="0 0 300 46" preserveAspectRatio="none" aria-hidden="true"><rect x="66" y="0" width="210" height="46"></rect><path id="cPath"></path></svg><span class="cdot" id="cDot"></span></div>
        <div class="cfoot" id="cWin"></div>
      </article>
    </div>
  </main>

  <footer class="ftr">
    <div class="kpi">
      <div class="kl">DISSENT · <span id="k1sub">BALLOT 03</span></div>
      <div class="kv o" id="k1">–</div>
      <div class="spark"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="base" d="M0 99H1000"></path><path class="o" id="k1p"></path></svg><span class="dot o" id="k1d"></span></div>
    </div>
    <div class="kpi">
      <div class="kl">SIGNALS THIS WEEK</div>
      <div class="kv" id="k2">–</div>
      <div class="spark"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="base" d="M0 99H1000"></path><path class="dim" id="k2fut"></path><path id="k2past"></path><rect id="k2r" x="0" y="86" width="0" height="14"></rect></svg></div>
    </div>
    <p class="note">Simulated sample data · <span class="nw">Nov 16–22, 2026 ·</span> not an official ballot</p>
    <div class="kpi r">
      <div class="kl">VOTES CAST TODAY</div>
      <div class="kv" id="k3">–</div>
      <div class="spark"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="dim" id="k3dim"></path><path id="k3now"></path></svg></div>
    </div>
    <div class="kpi r">
      <div class="kl">JOURNALS TODAY</div>
      <div class="kv" id="k4">–</div>
      <div class="spark"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="area" id="k4area"></path><path id="k4line"></path></svg><span class="dot" id="k4d"></span></div>
    </div>
  </footer>
</div>

    ctx.fillStyle = 'rgba(255,255,255,' + al + ')'; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    if (L.wide && !ui.card.hidden) {
      const cr = ui.card.getBoundingClientRect(), sr = ui.stage.getBoundingClientRect();
      const tx = cr.left - sr.left, ty = cr.top - sr.top + Math.min(64, cr.height * 0.3);
      if (tx > p.x + hs + 24) {
        const mx = Math.max(p.x + hs + 14, tx - Math.abs(ty - p.y) * 0.85 - 10);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * al).toFixed(3) + ')'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x + hs + 4, p.y); ctx.lineTo(mx, p.y); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,' + al + ')'; ctx.beginPath(); ctx.arc(tx, ty, 2.5, 0, TAU); ctx.fill();
      }
    }
  }

  // Hub: check mark while running, play triangle while paused.
  const hg = ctx.createRadialGradient(cx - hubR * 0.3, cy - hubR * 0.45, hubR * 0.1, cx, cy, hubR);
  hg.addColorStop(0, '#3b3b3b'); hg.addColorStop(1, '#131313');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, cy, hubR, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.beginPath();
  for (let k = 0; k < 48; k++) { const a = k / 48 * TAU; ctx.moveTo(cx + Math.sin(a) * hubR * 1.16, cy - Math.cos(a) * hubR * 1.16); ctx.lineTo(cx + Math.sin(a) * hubR * (k % 4 ? 1.24 : 1.3), cy - Math.cos(a) * hubR * (k % 4 ? 1.24 : 1.3)); }
  ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (playing) {
    ctx.strokeStyle = ACC; ctx.lineWidth = Math.max(1.6, hubR * 0.13);
    ctx.beginPath(); ctx.moveTo(cx - hubR * 0.36, cy + hubR * 0.02); ctx.lineTo(cx - hubR * 0.1, cy + hubR * 0.28); ctx.lineTo(cx + hubR * 0.38, cy - hubR * 0.26); ctx.stroke();
  } else {
    ctx.fillStyle = ACC; ctx.beginPath(); ctx.moveTo(cx - hubR * 0.22, cy - hubR * 0.34); ctx.lineTo(cx + hubR * 0.36, cy); ctx.lineTo(cx - hubR * 0.22, cy + hubR * 0.34); ctx.closePath(); ctx.fill();
  }
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}

function frame(now) {
  if (!lastNow) lastNow = now;
  const dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;
  if (!lay.R) layout();
  if (playing) {
    const a = t;
    let b = a + dt * SPEED, wrapped = false;
    if (b >= 168) { b -= 168; wrapped = true; }
    t = b;
    for (const e of VR.EV) { if ((!wrapped && a < e.t && e.t <= b) || (wrapped && (e.t > a || e.t <= b))) eventRow(e); }
    updateAct();
    if (wrapped) resampleAll();
    if (now - lastRow > 560) { lastRow = now; pushRow(t, true); }
  }
  syncCard(now);
  draw(now);
  if (now - lastUi > 125) { lastUi = now; render(); }
}

// Day tabs, one ballot per day; the small marks are the day's signals.
const tabs = VR.DAYS.map(function (x, i) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab';
  b.setAttribute('aria-label', x.name + ' ' + x.n + ', ' + x.ballot);
  const lab = document.createElement('span'); lab.textContent = x.k + ' ' + x.n;
  const track = document.createElement('span'); track.className = 'track';
  const fill = document.createElement('span'); fill.className = 'fill'; track.appendChild(fill);
  const marks = VR.EV.filter(function (e) { return Math.floor(e.t / 24) === i; }).map(function (e) {
    const m = document.createElement('span'); m.className = 'mk'; m.style.left = ((e.t - i * 24) / 24 * 100).toFixed(1) + '%';
    track.appendChild(m);
    return { el: m, e: e };
  });
  b.append(lab, track);
  b.addEventListener('click', function () { jump(i); });
  ui.days.appendChild(b);
  return { b: b, fill: fill, marks: marks };
});

ui.play.addEventListener('click', toggle);
ui.hub.addEventListener('click', toggle);
updateAct();
resampleAll();
for (let k = 22; k > 0; k--) pushRow(t - k * 0.37, false);
syncCard(performance.now());
layout();
render();
if (typeof ResizeObserver !== 'undefined') { const stageObserver = new ResizeObserver(layout); stageObserver.observe(ui.stage); }
else window.addEventListener('resize', layout);
let failed = false;
const loop = function (now) {
  requestAnimationFrame(loop);
  try { frame(now); } catch (err) { if (!failed) { failed = true; console.error(err); } }
};
requestAnimationFrame(loop);
}
</script>
</body>
